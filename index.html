<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#6557F5"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="description" content="منصة إدارة الباحثين — Research Management Platform (RDO)"/>
<title>RDO — Research Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<!-- System-font-first fallback so the page paints instantly; webfonts swap in when ready -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700;800&display=swap"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* Selis purple-violet brand palette */
  --r-icon:22.37%;
  --ink:#0a0820;
  --ink2:#26233f;
  --mute:#6b6a85;
  --mute2:#9a99b3;
  --line:#e8e8f3;
  --line2:#f0f0fa;
  --bg:#f7f7fb;
  --card:#ffffff;
  --p:#6557F5;            /* Selis primary */
  --p2:#8B7CFF;
  --p-dark:#4f43d4;
  --selis-grad:linear-gradient(135deg,#6557F5 0%,#8B7CFF 100%);
  --rag-on:#10b981;
  --rag-at:#f59e0b;
  --rag-off:#ef4444;
  --sh-icon:0 8px 24px rgba(101,87,245,.18),0 2px 6px rgba(10,8,32,.06);
  --sh-icon-h:0 16px 36px rgba(101,87,245,.28),0 4px 12px rgba(10,8,32,.08);
  --sh-card:0 2px 8px rgba(10,8,32,.05);
  --sh-card-h:0 6px 18px rgba(101,87,245,.14);
}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo','Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
}
html[lang="en"] body{font-family:'Inter','Cairo',system-ui,sans-serif;letter-spacing:-.015em}
html[lang="ar"] body{direction:rtl;text-align:right}
html[lang="en"] body{direction:ltr;text-align:left}
html[lang="ar"] .lbl-en,html[lang="en"] .lbl-ar{display:none}

button{font-family:inherit;cursor:pointer;border:none;background:transparent}
a{color:inherit;text-decoration:none}

.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
}
.tb-left{display:flex;align-items:center;gap:14px;min-width:0}
.tb-back{
  width:36px;height:36px;border-radius:10px;
  background:var(--bg);color:var(--ink);
  display:none;align-items:center;justify-content:center;
  transition:all .18s ease;
}
.tb-back:hover{background:var(--p);color:#fff}
.tb-back.show{display:inline-flex}
html[dir="rtl"] .tb-back svg{transform:scaleX(-1)}
.tb-title{font-size:20px;font-weight:800;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
.tb-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-btn{
  padding:8px 14px;border-radius:10px;
  font-size:13px;font-weight:700;
  background:#fff;border:1px solid var(--line);color:var(--ink);
  transition:all .18s ease;
}
.tb-btn:hover{border-color:var(--p);color:var(--p)}

.page{
  max-width:1100px;margin:0 auto;
  padding:48px 24px 80px;
  animation:fadeIn .35s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page-h{margin-bottom:32px}
.page-h h1{font-size:28px;font-weight:800;letter-spacing:-.025em;color:var(--ink)}
.page-h p{font-size:14px;color:var(--mute);margin-top:6px}

.icon-grid{
  display:grid;
  gap:32px 24px;
  justify-items:center;
}
.icon-grid.cols-4{grid-template-columns:repeat(4, minmax(0, 200px));justify-content:center}
.icon-grid.cols-6{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr))}

/* ── HOME CROSS LAYOUT — 4 surrounding 1 center, all uniform, no connectors ── */
.home-cross{
  display:grid;
  grid-template-columns:minmax(0,180px) minmax(0,180px) minmax(0,180px);
  grid-template-rows:auto auto auto;
  gap:44px 36px;
  justify-content:center;
  margin:24px auto 40px;
  position:relative;
  max-width:680px;
}
.home-cross .app-pos-top    {grid-column:2;grid-row:1}
.home-cross .app-pos-right  {grid-column:3;grid-row:2}
.home-cross .app-pos-bottom {grid-column:2;grid-row:3}
.home-cross .app-pos-left   {grid-column:1;grid-row:2}
.home-cross .app-pos-center {grid-column:2;grid-row:2}
.home-cross .app{position:relative;z-index:1}

@media(max-width:560px){
  .home-cross{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
    gap:28px 16px;
  }
}

/* Centered home title block */
.home-title{
  text-align:center;
  margin:8px auto 28px;
  max-width:680px;
}

/* App footer — visible contact strip at the bottom of every page */
.app-footer{
  text-align:center;
  padding:28px 18px 40px;
  font-size:14px;
  color:var(--mute);
  font-weight:600;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  letter-spacing:.01em;
  border-top:1px solid var(--line2);
  margin-top:48px;
}
.app-footer a{color:var(--ink2);text-decoration:none;transition:color .15s ease;font-weight:600}
.app-footer a:hover{color:var(--p)}
.app-footer .sep{color:var(--mute2);opacity:.55;font-size:13px}
.app-footer .name{color:var(--ink);font-weight:800}
@media(max-width:520px){
  .app-footer{font-size:13px;gap:10px;padding:22px 14px 28px}
  .app-footer .sep{display:none}
  .app-footer{flex-direction:column;gap:6px}
}
.home-title h1{
  font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--ink);
  margin:0 0 6px;
}
.home-title p{
  font-size:14px;color:var(--mute);font-weight:500;margin:0;
}

.app{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  cursor:pointer;
  width:100%;max-width:160px;
  -webkit-touch-callout:none;
  position:relative;
}
.app:hover .app-icon{transform:translateY(-4px) scale(1.02);box-shadow:var(--sh-icon-h)}
.app:active .app-icon{transform:scale(.96)}

.app-icon{
  width:120px;height:120px;
  border-radius:var(--r-icon);
  display:flex;align-items:center;justify-content:center;
  font-size:60px;line-height:1;color:#fff;
  box-shadow:var(--sh-icon),
             inset 0 1px 0 rgba(255,255,255,.22),
             inset 0 -1px 0 rgba(0,0,0,.16);
  position:relative;overflow:hidden;
  transition:transform .22s cubic-bezier(.32,1.2,.5,1),box-shadow .22s ease;
}
.app-icon::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.24),transparent 38%);
  pointer-events:none;
}
.app-icon::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.20), transparent 50%);
  pointer-events:none;
}
/* SVG line-art glyphs sized inside any squircle/round container */
.app-icon svg, .row-icon svg, .glabel-icon svg, .rec-avatar svg, .raid-tile .icon svg, .kpi-icon svg{
  width:54%;height:54%;
  fill:none;stroke:rgba(255,255,255,.96);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  display:block;
}
.row-icon svg, .glabel-icon svg{stroke-width:1.85}
.kpi-icon svg{width:60%;height:60%}
.rec-avatar svg{width:50%;height:50%}
.app-icon .plus-tag{
  position:absolute;bottom:8px;right:8px;
  width:22px;height:22px;border-radius:50%;
  background:#fff;color:var(--ink);
  font-size:14px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.18);
  z-index:2;
}
html[dir="rtl"] .app-icon .plus-tag{right:auto;left:8px}
.app-label{
  font-size:16px;font-weight:700;color:var(--ink);
  text-align:center;line-height:1.25;
  max-width:160px;letter-spacing:-.005em;
}
.app-sub{
  font-size:12px;color:var(--mute);margin-top:3px;font-weight:500;
}
.app-iconwrap{position:relative;display:inline-block;line-height:0}
.app-badge{
  position:absolute;top:-8px;right:-8px;z-index:3;
  min-width:26px;height:26px;border-radius:13px;
  background:#ff3b30;color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 7px;
  border:2.5px solid var(--bg);
  box-shadow:0 2px 6px rgba(255,59,48,.4);
  pointer-events:none;
}
html[dir="rtl"] .app-badge{right:auto;left:-8px}

.icon-grid.cols-6 .app-icon{width:96px;height:96px;font-size:48px}
.icon-grid.cols-6 .app-label{font-size:14px}

/* Selis-aligned icon gradients — purple-led, with role-coded accents */
.bg-ministry  {background:linear-gradient(135deg,#6557F5 0%,#8B7CFF 100%)}
.bg-uni       {background:linear-gradient(135deg,#06b6d4 0%,#6557F5 100%)}
.bg-fellow    {background:linear-gradient(135deg,#f59e0b 0%,#6557F5 100%)}
.bg-tetco     {background:linear-gradient(135deg,#a855f7 0%,#ec4899 100%)}
.bg-spend     {background:linear-gradient(135deg,#10b981 0%,#22c55e 100%)}
.bg-contract  {background:linear-gradient(135deg,#6557F5 0%,#a855f7 100%)}
.bg-comms     {background:linear-gradient(135deg,#22c55e 0%,#10b981 100%)}
.bg-invoice   {background:linear-gradient(135deg,#f59e0b 0%,#fbbf24 100%)}
.bg-team      {background:linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%)}
.bg-progress  {background:linear-gradient(135deg,#ec4899 0%,#a855f7 100%)}
.bg-payment   {background:linear-gradient(135deg,#10b981 0%,#22c55e 100%)}
.bg-budget    {background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%)}
.bg-reports   {background:linear-gradient(135deg,#3b82f6 0%,#6557F5 100%)}
.bg-approval  {background:linear-gradient(135deg,#6557F5 0%,#3b82f6 100%)}
.bg-research  {background:linear-gradient(135deg,#f59e0b 0%,#ec4899 100%)}
.bg-program   {background:linear-gradient(135deg,#a855f7 0%,#6557F5 100%)}
.bg-tranches  {background:linear-gradient(135deg,#22c55e 0%,#3b82f6 100%)}
.bg-tasks     {background:linear-gradient(135deg,#ef4444 0%,#f59e0b 100%)}
.bg-search    {background:linear-gradient(135deg,#8e8e93 0%,#48484a 100%)}
.bg-info      {background:linear-gradient(135deg,#3b82f6 0%,#06b6d4 100%)}
.bg-add       {background:linear-gradient(135deg,#ec4899 0%,#f59e0b 100%)}
.bg-strategy  {background:linear-gradient(135deg,#6557F5 0%,#ec4899 100%)}
.bg-vision    {background:linear-gradient(135deg,#a855f7 0%,#ec4899 100%)}
.bg-objectives{background:linear-gradient(135deg,#6557F5 0%,#06b6d4 100%)}
.bg-kpi       {background:linear-gradient(135deg,#10b981 0%,#6557F5 100%)}
.bg-initiative{background:linear-gradient(135deg,#f59e0b 0%,#6557F5 100%)}
.bg-achieve   {background:linear-gradient(135deg,#fbbf24 0%,#10b981 100%)}
.bg-raid      {background:linear-gradient(135deg,#ef4444 0%,#6557F5 100%)}
.bg-audit     {background:linear-gradient(135deg,#48484a 0%,#6557F5 100%)}
.bg-inbox     {background:linear-gradient(135deg,#6557F5 0%,#3b82f6 100%)}
.bg-hijri     {background:linear-gradient(135deg,#10b981 0%,#6557F5 100%)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.kpi-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:var(--sh-card);
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.kpi-card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(101,87,245,0.14);
  border-color:rgba(101,87,245,0.35);
}
.kpi-card:active{transform:translateY(0)}
/* When a row sub-element should look like a link (e.g. a researcher name) */
.lnk{color:#6557F5;cursor:pointer;font-weight:600}
.lnk:hover{text-decoration:underline}
.kpi-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;margin-bottom:10px;
}
.kpi-lbl{font-size:11px;color:var(--mute);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em}
.kpi-val{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em;
  font-feature-settings:"tnum"}
.kpi-sub{font-size:12px;color:#10b981;margin-top:4px;font-weight:600}
.kpi-sub.warn{color:#f59e0b}
.kpi-sub.bad{color:#ef4444}

.section-h{
  font-size:13px;font-weight:800;color:var(--mute);
  text-transform:uppercase;letter-spacing:.06em;
  margin:24px 4px 12px;display:flex;align-items:center;gap:8px;
}
.section-h::before{content:'';width:3px;height:14px;background:var(--p);border-radius:2px}

.list{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--sh-card);
}
.row{
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--line2);cursor:pointer;
  transition:background .12s ease;
}
.row:last-child{border-bottom:none}
.row:hover{background:#fafafe}
.row-icon{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;flex-shrink:0;font-weight:800;
}
.row-body{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--mute);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:13px;color:var(--mute)}
.row-pill{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;
  background:rgba(118,118,128,.12);color:var(--ink2);
}
.pill-ok{background:rgba(16,185,129,.12);color:#10b981}
.pill-warn{background:rgba(245,158,11,.12);color:#f59e0b}
.pill-bad{background:rgba(239,68,68,.12);color:#ef4444}
.pill-info{background:rgba(10,132,255,.12);color:var(--p)}
.row-chev{color:var(--mute2);font-size:18px;line-height:1}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;width:160px;max-width:100%}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--p),#5e5ce6)}
.bar i.ok{background:linear-gradient(90deg,#10b981,#34d399)}
.bar i.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar i.bad{background:linear-gradient(90deg,#ef4444,#f87171)}

.search{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:18px;
  box-shadow:var(--sh-card);
}
.search input{
  flex:1;background:transparent;border:none;outline:none;
  font-family:inherit;font-size:14px;color:var(--ink);
}
.search svg{width:16px;height:16px;color:var(--mute2)}

.empty{text-align:center;padding:60px 20px;color:var(--mute)}
.empty .ei{font-size:48px;margin-bottom:14px;opacity:.4}
.empty p{font-size:15px}

/* ── MODAL ── */
.modal-bg{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,8,32,.45);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-start;justify-content:center;
  padding:60px 16px 40px;
  overflow-y:auto;
  animation:bgIn .22s ease both;
}
.modal-bg.open{display:flex}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);
  width:100%;max-width:560px;
  border-radius:22px;
  box-shadow:0 28px 60px rgba(10,8,32,.4),0 8px 18px rgba(10,8,32,.18);
  padding:24px;
  animation:modalIn .28s cubic-bezier(.34,1.4,.6,1) both;
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:14px;margin-bottom:16px;
  border-bottom:1px solid var(--line2);
}
.modal-title{font-size:18px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  background:var(--bg);color:var(--mute);font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.modal-close:hover{background:#ff453a;color:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.form-label{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.02em}
.form-input{
  background:var(--bg);border:1.5px solid transparent;border-radius:10px;
  padding:11px 13px;font-family:inherit;font-size:14px;color:var(--ink);
  outline:none;transition:all .15s ease;
}
.form-input:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(10,132,255,.1)}
textarea.form-input{min-height:80px;resize:vertical}
.form-note{font-size:11px;color:var(--mute2);margin-top:2px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.btn{
  padding:10px 18px;border-radius:10px;
  font-size:14px;font-weight:700;font-family:inherit;
  transition:all .15s ease;cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-pri{background:var(--p);color:#fff}
.btn-pri:hover{background:#0070dd;transform:translateY(-1px);box-shadow:0 4px 12px rgba(10,132,255,.3)}
.btn-sec{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn-sec:hover{background:var(--line2);border-color:var(--mute2)}

/* Toast */
.toast{
  position:fixed;bottom:30px;right:30px;z-index:300;
  background:#10b981;color:#fff;padding:14px 22px;
  border-radius:12px;font-weight:700;font-size:14px;
  box-shadow:0 12px 28px rgba(16,185,129,.4);
  display:none;animation:toastIn .25s cubic-bezier(.34,1.4,.6,1) both;
}
html[dir="rtl"] .toast{right:auto;left:30px}
.toast.show{display:block}
.toast.err{background:#ef4444;box-shadow:0 12px 28px rgba(239,68,68,.4)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* Floating Add Button (FAB) for list views */
.fab{
  position:fixed;bottom:30px;right:30px;z-index:60;
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 22px;border-radius:999px;
  background:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 100%);
  color:#fff;font-size:15px;font-weight:800;letter-spacing:-.01em;
  box-shadow:0 12px 28px rgba(10,132,255,.42),0 4px 10px rgba(10,8,32,.18);
  cursor:pointer;border:none;font-family:inherit;
  transition:transform .18s cubic-bezier(.32,1.2,.5,1),box-shadow .18s ease;
}
.fab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 18px 36px rgba(10,132,255,.55),0 6px 14px rgba(10,8,32,.22)}
.fab:active{transform:scale(.97)}
.fab .fab-plus{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;font-weight:900}
html[dir="rtl"] .fab{right:auto;left:30px}

/* ───── SELIS-STYLE OBJECTIVE CARDS ───── */
.obj-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;margin-bottom:24px;
}
.obj-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px;box-shadow:var(--sh-card);
  transition:transform .18s ease,box-shadow .18s ease;
  cursor:pointer;position:relative;overflow:hidden;
}
.obj-card:hover{transform:translateY(-2px);box-shadow:var(--sh-card-h);border-color:var(--p2)}
.obj-card.rag-on    {border-top:3px solid var(--rag-on)}
.obj-card.rag-at    {border-top:3px solid var(--rag-at)}
.obj-card.rag-off   {border-top:3px solid var(--rag-off)}
.obj-card.rag-plan  {border-top:3px solid var(--mute2)}
.obj-rag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 10px;border-radius:7px;
  margin-bottom:10px;
}
.obj-rag.rag-on{background:rgba(16,185,129,.12);color:var(--rag-on)}
.obj-rag.rag-at{background:rgba(245,158,11,.12);color:var(--rag-at)}
.obj-rag.rag-off{background:rgba(239,68,68,.12);color:var(--rag-off)}
.obj-rag.rag-plan{background:rgba(154,153,179,.12);color:var(--mute)}
.obj-rag .rag-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.obj-title{
  font-size:15px;font-weight:700;color:var(--ink);
  line-height:1.35;margin-bottom:14px;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.obj-progress-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.obj-pct{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.obj-trend{
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:3px;
  padding:3px 8px;border-radius:6px;
}
.obj-trend.up{background:rgba(16,185,129,.12);color:var(--rag-on)}
.obj-trend.down{background:rgba(239,68,68,.12);color:var(--rag-off)}
.obj-trend.flat{background:rgba(154,153,179,.12);color:var(--mute)}
.obj-bar{
  height:6px;border-radius:3px;background:var(--line);
  overflow:hidden;margin-bottom:14px;
}
.obj-bar i{display:block;height:100%;border-radius:3px}
.obj-bar i.fill-on{background:linear-gradient(90deg,#10b981,#34d399)}
.obj-bar i.fill-at{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.obj-bar i.fill-off{background:linear-gradient(90deg,#ef4444,#f87171)}
.obj-bar i.fill-plan{background:linear-gradient(90deg,#9a99b3,#cccccc)}
.obj-raid{
  display:flex;gap:8px;flex-wrap:wrap;
  padding-top:12px;border-top:1px solid var(--line2);
}
.raid-chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--ink2);
  padding:4px 9px;border-radius:7px;background:var(--bg);
  border:1px solid var(--line);
}
.raid-chip strong{color:var(--p);font-weight:800;font-size:12px}
.raid-chip.r-r{border-color:rgba(239,68,68,.3)}
.raid-chip.r-r strong{color:#ef4444}
.raid-chip.r-a{border-color:rgba(245,158,11,.3)}
.raid-chip.r-a strong{color:#f59e0b}
.raid-chip.r-i{border-color:rgba(101,87,245,.3)}
.raid-chip.r-i strong{color:#6557F5}
.raid-chip.r-d{border-color:rgba(16,185,129,.3)}
.raid-chip.r-d strong{color:#10b981}
.raid-chip.r-x{border-color:rgba(168,85,247,.3)}
.raid-chip.r-x strong{color:#a855f7}

/* Selis-style hero "MyRDO" overview */
.my-hero{
  background:var(--selis-grad);color:#fff;
  border-radius:22px;padding:28px;margin-bottom:24px;
  position:relative;overflow:hidden;
  box-shadow:0 16px 40px rgba(101,87,245,.32);
}
.my-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 90% 0%, rgba(255,255,255,.18), transparent 50%);
  pointer-events:none;
}
.my-hero-greet{font-size:14px;opacity:.85;font-weight:600;margin-bottom:6px}
.my-hero-name{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.my-hero-tags{display:flex;gap:8px;flex-wrap:wrap}
.my-hero-tag{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:7px 14px;border-radius:999px;
  font-size:13px;font-weight:700;color:#fff;
  border:1px solid rgba(255,255,255,.22);
}
.my-hero-tag .tag-num{font-size:14px;font-weight:800}

.dash-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;margin-bottom:28px;
}
.dash-widget{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px;box-shadow:var(--sh-card);
}
.dw-h{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.dw-h-title{font-size:13px;font-weight:800;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.dw-h-title::before{content:'';width:3px;height:14px;background:var(--p);border-radius:2px}
.dw-h-action{font-size:12px;color:var(--p);font-weight:700;cursor:pointer}
.dw-h-action:hover{text-decoration:underline}

.raid-summary{display:flex;gap:8px;flex-wrap:wrap}
.raid-sum-card{
  flex:1;min-width:90px;background:var(--bg);border-radius:10px;padding:11px 12px;
  border:1px solid var(--line);
}
.raid-sum-card .lbl{font-size:10px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.raid-sum-card .num{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:4px}

/* Hijri date small chip */
.hijri-chip{
  font-size:11px;color:var(--p-dark);background:rgba(101,87,245,.08);
  padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:600;
}

/* ───── GANTT-STYLE SCHEDULE TIMELINE ───── */
.gantt-wrap{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-card);overflow:hidden;
}
.gantt-axis{
  display:flex;align-items:center;
  background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 16px 10px 220px;font-size:11px;color:var(--mute);font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;
  position:relative;min-height:34px;
}
html[dir="rtl"] .gantt-axis{padding:10px 220px 10px 16px}
.gantt-axis .tick{flex:1;text-align:left;padding-left:6px;border-left:1px solid var(--line2)}
html[dir="rtl"] .gantt-axis .tick{text-align:right;padding-left:0;padding-right:6px;border-left:none;border-right:1px solid var(--line2)}
.gantt-axis .tick:first-child{border-left:none}
html[dir="rtl"] .gantt-axis .tick:first-child{border-right:none}

.gantt-row{
  display:flex;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--line2);
  position:relative;min-height:46px;cursor:pointer;
  transition:background .12s ease;
}
.gantt-row:hover{background:#fafafe}
.gantt-row:last-child{border-bottom:none}
.gantt-label{
  width:200px;flex-shrink:0;padding-right:18px;
  display:flex;align-items:center;gap:10px;
}
html[dir="rtl"] .gantt-label{padding-right:0;padding-left:18px}
.gantt-label .glabel-icon{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;
}
.gantt-label .glabel-text{
  font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;
}
.gantt-track{
  flex:1;height:24px;background:var(--bg);border-radius:6px;
  position:relative;overflow:visible;
}
.gantt-bar{
  position:absolute;top:0;height:100%;border-radius:6px;
  display:flex;align-items:center;justify-content:flex-start;
  padding:0 8px;font-size:11px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,#6557F5,#8B7CFF);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
.gantt-bar.bar-on    {background:linear-gradient(90deg,#10b981,#34d399)}
.gantt-bar.bar-at    {background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.gantt-bar.bar-off   {background:linear-gradient(90deg,#ef4444,#f87171)}
.gantt-bar.bar-plan  {background:linear-gradient(90deg,#9a99b3,#cccccc)}
.gantt-actual{
  position:absolute;top:auto;bottom:-3px;height:4px;border-radius:2px;
  background:#0a0820;opacity:.55;
}
.gantt-now-line{
  position:absolute;top:0;bottom:0;width:2px;
  background:#ef4444;z-index:2;pointer-events:none;
}
.gantt-now-line::after{
  content:'NOW';position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:9px;font-weight:800;color:#ef4444;background:#fff;
  padding:1px 4px;border-radius:3px;letter-spacing:.08em;
}

/* ───── INLINE SVG DASHBOARD CHART CARDS ───── */
.chart-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
  gap:14px;margin-bottom:24px;
}
.chart-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;box-shadow:var(--sh-card);
  display:flex;flex-direction:column;gap:12px;
}
.chart-card-h{
  display:flex;align-items:center;justify-content:space-between;
}
.chart-card-h .title{
  font-size:13px;font-weight:800;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px;
}
.chart-card-h .title::before{content:'';width:3px;height:14px;background:var(--p);border-radius:2px}
.chart-card-h .total{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.chart-svg{width:100%;height:auto;display:block}

.donut-legend{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.donut-legend .leg{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.donut-legend .leg .lab{display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.donut-legend .leg .swatch{width:10px;height:10px;border-radius:3px}
.donut-legend .leg .val{font-weight:800;font-feature-settings:"tnum"}

.bar-list-mini{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.bar-list-mini .row{padding:6px 0;border:none;display:flex;align-items:center;gap:10px}
.bar-list-mini .lab{font-size:12px;font-weight:700;color:var(--ink2);width:120px;flex-shrink:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-list-mini .track{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar-list-mini .track .fill{display:block;height:100%;border-radius:4px;background:var(--selis-grad)}
.bar-list-mini .num{font-size:12px;font-weight:800;font-feature-settings:"tnum";color:var(--ink);min-width:54px;text-align:right}
html[dir="rtl"] .bar-list-mini .num{text-align:left}

/* ───── SELIS-STYLE CARD WITH CIRCULAR GAUGE ───── */
.selis-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:14px;margin-bottom:24px;
}
.selis-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-card);padding:14px;
  display:flex;flex-direction:column;gap:10px;
  cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  position:relative;
}
.selis-card:hover{transform:translateY(-2px);box-shadow:var(--sh-card-h);border-color:var(--p2)}
.sc-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--mute);font-weight:700;
}
.sc-head .new-pill{
  background:var(--selis-grad);color:#fff;padding:2px 8px;border-radius:6px;
  font-size:10px;letter-spacing:.06em;font-weight:800;
}
.sc-head .sc-actions{display:flex;gap:8px;color:var(--mute2);font-size:13px}
.sc-head .sc-actions button{background:transparent;border:none;cursor:pointer;color:inherit}
.sc-title{font-size:15px;font-weight:800;color:var(--ink);line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.sc-pills{display:flex;gap:5px;flex-wrap:wrap}
.sc-pills .row-pill{font-size:10px;padding:3px 8px}
.sc-gauge-wrap{display:flex;align-items:center;justify-content:center;padding:8px 0 4px}
.sc-owner{
  display:flex;align-items:center;gap:8px;
  padding-top:10px;border-top:1px solid var(--line2);
  font-size:13px;color:var(--ink2);font-weight:600;
}
.sc-owner .av{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#a5a5b8,#7a7a90);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;
}
.sc-bottom{
  display:flex;gap:8px;padding-top:8px;
}
.sc-act{
  width:30px;height:30px;border-radius:8px;
  background:var(--bg);color:var(--mute);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;border:1px solid var(--line);
  transition:all .15s ease;position:relative;
}
.sc-act:hover{background:var(--p);color:#fff;border-color:var(--p)}
.sc-act .raid-mini-badge{
  position:absolute;top:-4px;right:-4px;
  width:14px;height:14px;border-radius:50%;
  background:var(--p);color:#fff;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}

/* Circular progress gauge */
.gauge{display:block;margin:0 auto}
.gauge-num{font-size:20px;font-weight:800;letter-spacing:-.02em;font-family:inherit;font-feature-settings:"tnum"}
.gauge-lbl{font-size:9px;font-weight:700;letter-spacing:.12em}

/* ───── SELIS-STYLE DETAIL HERO ───── */
.detail-top{display:grid;grid-template-columns:1fr 230px;gap:16px;margin-bottom:18px}
@media(max-width:780px){ .detail-top{grid-template-columns:1fr} }

.metric-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){ .metric-cards{grid-template-columns:1fr} }
.metric-card{
  background:#fff5f1;border:1px solid #ffd9cc;border-radius:14px;
  padding:18px 18px 14px;position:relative;overflow:hidden;
}
.metric-card.green{background:#eef9f0;border-color:#bce3c5}
.metric-card-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.metric-card-h .lbl{font-size:13px;color:var(--mute);font-weight:700}
.metric-card-h .arrow{
  width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;color:var(--mute);
  cursor:pointer;font-size:13px;
}
.metric-card .pct{font-size:36px;font-weight:800;letter-spacing:-.025em;color:#ef4444;font-feature-settings:"tnum"}
.metric-card.green .pct{color:#22a060}
.metric-card .pi{display:flex;justify-content:space-between;font-size:11px;color:var(--mute2);font-weight:700;margin-top:4px}
.metric-bar{height:8px;border-radius:4px;background:#fff;overflow:hidden;margin-top:14px;border:1px solid rgba(255,255,255,.5)}
.metric-bar i{display:block;height:100%;border-radius:4px;background:#ef4444}
.metric-card.green .metric-bar i{background:#22a060}
.metric-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.metric-mini .mm-card{
  background:#fff;border-radius:10px;padding:10px 12px;text-align:center;
  border:1px solid rgba(255,255,255,.6);
}
.metric-card.green .metric-mini .mm-card{background:#fff}
.metric-mini .mm-lbl{font-size:11px;color:var(--mute);font-weight:700}
.metric-mini .mm-val{font-size:22px;font-weight:800;color:#ef4444;letter-spacing:-.02em;margin-top:2px;font-feature-settings:"tnum"}
.metric-card.green .metric-mini .mm-val{color:#22a060}

.detail-side{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--sh-card);
}
.detail-side .ds-block{padding-bottom:14px;border-bottom:1px dashed var(--line2)}
.detail-side .ds-block:last-child{border-bottom:none;padding-bottom:0}
.detail-side .ds-lbl{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.detail-side .ds-val{font-size:14px;color:var(--ink);font-weight:700}

.phase-stepper{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:nowrap}
.phase-stepper .ps-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--line);flex-shrink:0;
}
.phase-stepper .ps-dot.done{background:var(--p)}
.phase-stepper .ps-dot.curr{background:var(--p);box-shadow:0 0 0 3px rgba(101,87,245,.22)}
.phase-stepper .ps-line{flex:1;height:2px;background:var(--line)}
.phase-stepper .ps-line.done{background:var(--p)}

.health-card,.priority-card{
  background:#fff5f1;border:1px solid #ffd9cc;border-radius:12px;
  padding:12px;display:flex;align-items:center;gap:10px;
}
.priority-card{background:#fff8eb;border-color:#fde2af}
.hc-icon{
  width:34px;height:34px;border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  color:#ef4444;font-weight:800;
}
.priority-card .hc-icon{color:#f59e0b}
.hc-body{flex:1;min-width:0}
.hc-lbl{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.hc-val{font-size:15px;font-weight:800;color:var(--ink2);margin-top:2px}

/* Tabs bar under detail hero */
.detail-tabs{
  display:flex;gap:0;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:6px;box-shadow:var(--sh-card);margin-bottom:18px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.detail-tabs::-webkit-scrollbar{height:0}
.detail-tab{
  padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:700;color:var(--mute);
  cursor:pointer;white-space:nowrap;transition:all .15s ease;
  font-family:inherit;border:none;background:transparent;
}
.detail-tab:hover{color:var(--ink)}
.detail-tab.active{background:var(--bg);color:var(--p);box-shadow:0 1px 3px rgba(101,87,245,.18)}
.detail-tab .count{
  display:inline-flex;align-items:center;justify-content:center;
  margin-left:4px;background:rgba(101,87,245,.15);color:var(--p);
  font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;min-width:18px;
}

/* RAID letter chips on rows */
.raid-chips{display:inline-flex;gap:3px;margin-left:6px}
.raid-chips .rc{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;
  background:rgba(154,153,179,.14);color:var(--mute);
}
.raid-chips .rc.has{background:rgba(101,87,245,.15);color:var(--p)}
.raid-chips .rc.r-r.has{background:rgba(239,68,68,.15);color:#ef4444}
.raid-chips .rc.r-a.has{background:rgba(245,158,11,.15);color:#f59e0b}
.raid-chips .rc.r-i.has{background:rgba(16,185,129,.15);color:#10b981}
.raid-chips .rc.r-d.has{background:rgba(101,87,245,.15);color:#6557F5}
.raid-chips .rc.r-c.has{background:rgba(168,85,247,.15);color:#a855f7}
.raid-chips .rc.r-f.has{background:rgba(6,182,212,.15);color:#06b6d4}

/* Modal tabs (top of edit/create modals) */
.modal-tabs{
  display:flex;gap:6px;padding:6px;background:var(--bg);border-radius:10px;
  margin-bottom:14px;overflow-x:auto;
}
.modal-tab{
  padding:8px 14px;border-radius:8px;
  font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;
  white-space:nowrap;transition:all .15s ease;background:transparent;border:none;
  font-family:inherit;
}
.modal-tab.active{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(101,87,245,.18)}
.modal-tab:hover{color:var(--ink)}
.modal-tab-pane{display:none}
.modal-tab-pane.active{display:block}

/* RAID record-detail widget */
.raid-record{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-card);padding:18px;margin-bottom:18px;
}
.raid-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.raid-tile{
  text-align:center;padding:14px 8px;border-radius:12px;
  background:var(--bg);border:1px solid var(--line);
  transition:all .15s ease;cursor:pointer;
}
.raid-tile:hover{transform:translateY(-2px);box-shadow:var(--sh-card-h);border-color:var(--p)}
.raid-tile .icon{font-size:20px;margin-bottom:6px}
.raid-tile .num{font-size:22px;font-weight:800;letter-spacing:-.02em}
.raid-tile .lbl{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.raid-tile.r-r{border-color:rgba(239,68,68,.25)}
.raid-tile.r-a{border-color:rgba(245,158,11,.25)}
.raid-tile.r-i{border-color:rgba(101,87,245,.25)}
.raid-tile.r-d{border-color:rgba(16,185,129,.25)}
.raid-tile.r-x{border-color:rgba(168,85,247,.25)}

/* Inline list-page header Add button (alternative location) */
.add-bar{display:flex;justify-content:flex-end;margin-bottom:12px}
.add-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:12px;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;
  font-size:14px;font-weight:700;font-family:inherit;
  box-shadow:0 6px 16px rgba(10,132,255,.32);
  cursor:pointer;border:none;transition:all .15s ease;
}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(10,132,255,.4)}
.add-btn .ab-plus{font-size:18px;font-weight:900;line-height:1}

/* ───── RECORD DETAIL VIEW ───── */
.rec-hero{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:24px;margin-bottom:18px;box-shadow:var(--sh-card);
  display:flex;gap:18px;align-items:flex-start;
}
.rec-avatar{
  width:64px;height:64px;border-radius:18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;font-weight:800;
  box-shadow:var(--sh-icon),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.16);
}
.rec-head{flex:1;min-width:0}
.rec-h-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.rec-h-sub{font-size:13px;color:var(--mute);font-weight:500}
.rec-h-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rec-actions{display:flex;gap:8px;flex-shrink:0}
.rec-act{
  width:36px;height:36px;border-radius:10px;
  background:var(--bg);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;cursor:pointer;border:1px solid var(--line);
  transition:all .15s ease;
}
.rec-act:hover{background:var(--p);color:#fff;border-color:var(--p)}

.rec-section{margin-bottom:18px}
.rec-grid{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--sh-card);
}
.field-row{
  display:flex;align-items:flex-start;
  padding:12px 18px;border-bottom:1px solid var(--line2);
  gap:16px;
}
.field-row:last-child{border-bottom:none}
.field-key{
  font-size:12px;font-weight:700;color:var(--mute);
  text-transform:uppercase;letter-spacing:.04em;
  min-width:160px;flex-shrink:0;padding-top:2px;
}
.field-val{flex:1;font-size:14px;color:var(--ink);font-weight:500;word-break:break-word;
  font-feature-settings:"tnum"}
.field-val.mono{font-family:'SF Mono',ui-monospace,Menlo,Monaco,monospace;font-size:13px}
.field-val.muted{color:var(--mute2)}
.field-val a.link{color:var(--p);font-weight:600;cursor:pointer;text-decoration:none}
.field-val a.link:hover{text-decoration:underline}

/* Source badge */
.src-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:8px;
  font-size:11px;font-weight:700;
  background:rgba(10,132,255,.1);color:var(--p);
  border:1px solid rgba(10,132,255,.18);
}
.src-badge.imported{background:rgba(94,92,230,.1);color:#5e5ce6;border-color:rgba(94,92,230,.18)}
.src-badge.manual{background:rgba(52,199,89,.1);color:#34c759;border-color:rgba(52,199,89,.18)}
.src-badge.derived{background:rgba(255,159,10,.1);color:#ff9f0a;border-color:rgba(255,159,10,.18)}

/* Status workflow stepper */
.status-flow{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;box-shadow:var(--sh-card);
}
.flow-track{
  display:flex;gap:0;align-items:flex-start;justify-content:space-between;
  position:relative;
}
.flow-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;text-align:center}
.flow-step:not(:last-child)::after{
  content:'';position:absolute;top:14px;
  left:calc(50% + 16px);right:calc(-50% + 16px);
  height:2px;background:var(--line);z-index:0;
}
.flow-step.done:not(:last-child)::after{background:#34c759}
.flow-step.curr:not(:last-child)::after{background:linear-gradient(90deg,#34c759 0%,var(--line) 100%)}
html[dir="rtl"] .flow-step:not(:last-child)::after{
  left:calc(-50% + 16px);right:calc(50% + 16px);
  background:linear-gradient(270deg,#34c759 0%,var(--line) 100%);
}
.flow-dot{
  width:30px;height:30px;border-radius:50%;
  background:var(--bg);color:var(--mute);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;
  border:2px solid var(--line);
  position:relative;z-index:1;
}
.flow-step.done .flow-dot{background:#34c759;color:#fff;border-color:#34c759}
.flow-step.curr .flow-dot{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 0 0 4px rgba(10,132,255,.2)}
.flow-lbl{font-size:11px;font-weight:700;color:var(--ink2);line-height:1.25;max-width:90px}
.flow-step.curr .flow-lbl{color:var(--p)}

/* Comments thread */
.comments-thread{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-card);overflow:hidden;
}
.comment-row{
  display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2);
}
.comment-row:last-child{border-bottom:none}
.comm-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--p),#5e5ce6);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;flex-shrink:0;
}
.comm-body{flex:1;min-width:0}
.comm-meta{font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px}
.comm-meta .auth{color:var(--ink);font-weight:700}
.comm-text{font-size:14px;color:var(--ink2);line-height:1.5;word-break:break-word}
.comm-empty{padding:32px 18px;text-align:center;color:var(--mute2);font-size:14px}
.comm-input-wrap{
  display:flex;gap:10px;padding:14px 18px;
  background:var(--bg);border-top:1px solid var(--line2);
}
.comm-input{
  flex:1;background:#fff;border:1.5px solid transparent;border-radius:10px;
  padding:10px 14px;font-family:inherit;font-size:14px;color:var(--ink);
  outline:none;transition:all .15s ease;
}
.comm-input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(10,132,255,.1)}
.comm-send{
  padding:10px 18px;border-radius:10px;
  background:var(--p);color:#fff;font-weight:700;font-size:13px;
  cursor:pointer;border:none;font-family:inherit;
  transition:all .15s ease;
}
.comm-send:hover{background:#0070dd}

/* @mention chips inside comment text + the autocomplete picker */
.mention-chip{
  display:inline-block;background:rgba(101,87,245,0.12);color:#6557F5;
  padding:1px 8px;border-radius:6px;font-weight:600;font-size:13px;
  text-decoration:none;
}
.mention-chip.mc-sm{font-size:11px;padding:1px 6px}
.comm-mentions{
  margin-top:4px;font-size:11px;opacity:0.75;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.mention-picker{
  position:absolute;bottom:calc(100% + 4px);left:18px;right:18px;
  background:#fff;border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.12);
  max-height:240px;overflow-y:auto;z-index:1000;
}
.mention-row{
  display:flex;gap:10px;padding:8px 12px;align-items:center;
  cursor:pointer;border-bottom:1px solid var(--line2);
}
.mention-row:last-child{border-bottom:none}
.mention-row:hover, .mention-row.active{background:rgba(101,87,245,0.08)}
.mention-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#6557F5,#9089F5);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;
}
.mention-text{flex:1;min-width:0;overflow:hidden}
.mention-name{font-weight:600;font-size:13px;color:var(--ink)}
.mention-source{font-size:11px;opacity:0.7;margin-inline-start:4px}
.mention-sub{font-size:11px;opacity:0.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mention-empty{padding:12px;font-size:12px;color:#888;text-align:center}

/* Top-bar bell + notification panel */
.tb-bell{position:relative}
.bell-count{
  position:absolute;top:2px;right:2px;
  background:#ef4444;color:#fff;border-radius:10px;
  font-size:10px;font-weight:700;padding:1px 5px;
  min-width:16px;height:16px;line-height:14px;text-align:center;
  border:2px solid var(--bg);
}
html[dir="rtl"] .bell-count{right:auto;left:2px}
.notif-panel{
  position:absolute;top:calc(100% - 4px);right:18px;
  width:340px;max-height:480px;overflow-y:auto;
  background:#fff;border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,0.16);
  z-index:1500;
}
html[dir="rtl"] .notif-panel{right:auto;left:18px}
.notif-head{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center}
.notif-head h4{margin:0;font-size:14px;color:var(--ink)}
.notif-head .mark-all{font-size:12px;background:none;border:none;color:#6557F5;cursor:pointer}
.notif-row{padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.notif-row:last-child{border-bottom:none}
.notif-row:hover{background:rgba(101,87,245,0.06)}
.notif-row.unread{background:rgba(101,87,245,0.04)}
.notif-row.unread .notif-name{font-weight:700}
.notif-icon{width:28px;height:28px;border-radius:8px;background:rgba(101,87,245,0.12);color:#6557F5;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-name{font-size:13px;color:var(--ink)}
.notif-snip{font-size:12px;color:#666;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.notif-when{font-size:11px;color:#999;margin-top:2px}
.notif-empty{padding:32px 14px;text-align:center;color:#888;font-size:13px}
.notif-dot{width:8px;height:8px;border-radius:50%;background:#6557F5;flex-shrink:0;margin-top:8px}
@media(max-width:520px){
  .notif-panel{width:calc(100vw - 24px);right:12px;left:12px;max-width:none}
  html[dir="rtl"] .notif-panel{left:12px;right:12px}
}

/* Linked records mini-list */
.mini-list .row{padding:10px 14px}
.mini-list .row-icon{width:28px;height:28px;font-size:13px;border-radius:7px}
.mini-list .row-title{font-size:13px}
.mini-list .row-sub{font-size:11px}

/* Compute time-aware EVM for a spending plan as of "today" */
function spPlanEvm(p, asOfIso){
  const today = asOfIso ? new Date(asOfIso) : new Date();
  const start = new Date(p.start), end = new Date(p.end);
  const totalDays = Math.max(1, (end-start)/86400000);
  const elapsedDays = Math.max(0, Math.min(totalDays, (today-start)/86400000));
  const timeElapsedPct = +(elapsedDays/totalDays*100).toFixed(1);
  const timeRemainingPct = +(100 - timeElapsedPct).toFixed(1);
  // Planned spend at this point (linear distribution across phases by day)
  let plannedToDate = 0, earned = 0;
  for(const ph of p.phases){
    const ps = new Date(ph.start), pe = new Date(ph.end);
    if(today >= pe){
      plannedToDate += ph.planned;
      earned += ph.actual; // EV approximated by actual delivered
    } else if(today > ps){
      const phDays = Math.max(1, (pe-ps)/86400000);
      const phElapsed = (today-ps)/86400000;
      plannedToDate += ph.planned * (phElapsed/phDays);
      // Earned value = portion physically delivered (proxy: actual / planned of completed % * planned) — keep simple:
      earned += ph.actual; // best proxy in our seed data
    }
  }
  const ac = p.total_spent;          // Actual Cost to date
  const pv = plannedToDate;          // Planned Value to date
  const ev = earned;                 // Earned Value to date
  const sv = ev - pv;                // Schedule Variance (cost terms)
  const cv = ev - ac;                // Cost Variance
  const spi = pv ? ev/pv : 0;
  const cpi = ac ? ev/ac : 0;
  const eac = cpi ? p.total_budget/cpi : p.total_budget;
  const etc = eac - ac;
  const vac = p.total_budget - eac;
  // Plain-language statuses
  const scheduleStatus = spi > 1.05 ? 'ahead' : spi < 0.95 ? 'behind' : 'on';
  const budgetStatus = cpi > 1.05 ? 'under' : cpi < 0.95 ? 'over' : 'on';
  return {timeElapsedPct, timeRemainingPct, pv, ev, ac, sv, cv, spi, cpi, eac, etc, vac, scheduleStatus, budgetStatus, plannedToDate};
}

function evmCalc(e){
  const sv = e.ev - e.pv;       // Schedule variance
  const cv = e.ev - e.ac;       // Cost variance
  const spi = e.pv ? e.ev / e.pv : 0;   // Schedule Performance Index
  const cpi = e.ac ? e.ev / e.ac : 0;   // Cost Performance Index
  const eac = cpi ? e.bac / cpi : e.bac;// Estimate at Completion
  const etc = eac - e.ac;       // Estimate to Complete
  const vac = e.bac - eac;      // Variance at Completion
  return {sv, cv, spi, cpi, eac, etc, vac};
}

/* Render an icon: if `key` is in ICON_SVG, return inline SVG; else passthrough (emoji) */
function renderIcon(key){
  if(!key) return '';
  if(ICON_SVG[key]) return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_SVG[key]}</svg>`;
  return key; // emoji or other text
}

/* Hijri date — uses Intl with islamic-umalqura calendar; returns DD/MM/YYYY hijri */
function toHijri(isoDate){
  if(!isoDate) return '';
  try{
    const d = new Date(isoDate);
    if(isNaN(d.getTime())) return '';
    const fmtH = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'});
    const parts = fmtH.formatToParts(d);
    const dd = parts.find(p=>p.type==='day').value;
    const mm = parts.find(p=>p.type==='month').value;
    const yy = parts.find(p=>p.type==='year').value.replace(/[^0-9]/g,'');
    return `${dd}/${mm}/${yy}`;
  } catch(e){ return ''; }
}
function dateWithHijri(isoDate){
  if(!isoDate) return '—';
  const h = toHijri(isoDate);
  return `${isoDate}${h?`<span class="hijri-chip">هـ ${h}</span>`:''}`;
}

/* RAG class helper */
function ragClass(rag){
  return rag==='on-track'?'rag-on':rag==='at-risk'?'rag-at':rag==='off-track'?'rag-off':'rag-plan';
}
function ragLabel(rag){
  return rag==='on-track'?T('على المسار','On Track')
       : rag==='at-risk'?T('في خطر','At Risk')
       : rag==='off-track'?T('خارج المسار','Off Track')
       :T('مخططة','Planned');
}
function trendArrow(t){
  return t==='up'?'↑':t==='down'?'↓':'→';
}

  let progId = programId;
  if(!progId && type==='objective'){
    const o = OBJECTIVES.find(o=>o.id===id);
    progId = o?.linked_programs?.[0];
  }
  if(!progId && type==='initiative'){
    const i = INITIATIVES.find(i=>i.id===id);
    progId = i?.program_id;
  }
  const filt = (arr, key) => progId ? arr.filter(x=>x[key]===progId).length : arr.length;
  return {
    risks:    filt(RISKS, 'program_id'),
    actions:  filt(TASKS, 'program_id'), // tasks act as "actions"
    issues:   filt(ISSUES, 'program_id'),
    decisions:filt(DECISIONS, 'program_id'),
    deps:     filt(CHANGES, 'program_id') // change requests act as dependencies/changes
  };
}

  return `<div class="app ${extraClass||''}" onclick="onAppClick('${a.key}')">
    <div class="app-iconwrap">
      <div class="app-icon ${a.bg}">${renderIcon(a.icon)}${plus}</div>
      ${badge}

    <div>
      <div class="app-label"><span class="lbl-ar">${a.ar}</span><span class="lbl-en">${a.en}</span></div>
      ${sub}
    </div>
  </div>`;
}

  document.getElementById('tbTitle').textContent = title;
  document.getElementById('tbSub').textContent  = sub;

}

function onAppClick(key){
  if(FOLDERS[key]) { stack.push({type:'folder', key}); renderFolder(key); }
  else            { stack.push({type:'detail', key}); renderDetail(key); }
  window.scrollTo({top:0, behavior:'smooth'});
}

function openRecord(type, id){
  stack.push({type:'record', recType:type, id:id});
  renderRecord(type, id);
  window.scrollTo({top:0, behavior:'smooth'});
}
function openProgramRecord(idx){
  const p = PROGRAMS[idx];
  if(!p) return;
  // Use index as id key for routing
  stack.push({type:'record', recType:'program', id:idx});
  renderRecord('program', idx);
  window.scrollTo({top:0, behavior:'smooth'});
}
function goBack(){
  if(stack.length<=1) return;
  stack.pop();
  const top = stack[stack.length-1];
  if(top==='home') renderHome();
  else if(top.type==='folder') renderFolder(top.key);
  else if(top.type==='record') renderRecord(top.recType, top.id);
  else renderDetail(top.key);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* Jump straight to the home page from anywhere — used by the Home button
   and by tapping the RDO title in the top bar. */
function goHome(){
  stack.length = 0;
  stack.push('home');
  renderHome();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ════════════════════════════════════════════
   COMPUTED TOTALS
════════════════════════════════════════════ */
/* ─────────────────────────────────────────────────────────────────────
   MONEY FLOW — single source of truth = PAYMENTS table.
   On page load, reconcileMoneyFlow():
     1. Backfills synthetic PAYMENTS so SUM(PAYMENTS) per (uni, program)
        equals the seed-data uni.<program>.disbursed value.
     2. Then OVERWRITES uni.<program>.disbursed, researcher.disbursed,
        and EVM.ac to be derived from PAYMENTS.
   From then on, adding/removing a payment in the UI automatically
   updates every dashboard.
   ───────────────────────────────────────────────────────────────────── */
function _isPaidStatus(p){ return p.status==='transferred' || p.status==='approved'; }
function paymentsForUniProgram(uni_id, program){
  return PAYMENTS.filter(p => p.uni_id===uni_id && p.program===program && _isPaidStatus(p));
}
function paymentsForResearcher(name){
  return PAYMENTS.filter(p => p.researcher===name && _isPaidStatus(p));
}
function paymentsForProgram(program){
  return PAYMENTS.filter(p => p.program===program && _isPaidStatus(p));
}
function _sumAmount(arr){ return arr.reduce((s,p)=>s+(p.amount||0), 0); }

function reconcileMoneyFlow(){
  // 1) Strip any prior synthetic reconciliation payments — keeps this idempotent
  PAYMENTS = PAYMENTS.filter(p => !p.synthetic);

  // 2) For each (uni, program) where the seed uni.disbursed > sum of real PAYMENTS,
  //    insert one synthetic "historical reconciliation" payment for the gap.
  let nextId = (PAYMENTS.length ? Math.max(...PAYMENTS.map(p=>p.id)) : 0) + 1;
  UNI_DATA.forEach(u => {
    ['postdoc','infra','hqr'].forEach(prog => {
      const seedDisbursed = (u[prog] && u[prog].disbursed) || 0;
      if (!seedDisbursed) return;
      const realSum = _sumAmount(paymentsForUniProgram(u.id, prog));
      const gap = seedDisbursed - realSum;
      if (gap > 0){
        PAYMENTS.push({
          id: nextId++, uni_id: u.id, program: prog,
          researcher: 'Historical (multiple)', tranche: 0, amount: gap,
          date: '2019-12-31', status: 'transferred',
          notes: 'Auto-generated to reconcile audit trail with reported disbursed total',
          synthetic: true
        });
      }
    });
  });

  // 3) Now make every "stored" disbursed/AC value reflect the PAYMENTS sum
  UNI_DATA.forEach(u => {
    ['postdoc','infra','hqr'].forEach(prog => {
      if (!u[prog]) return;
      u[prog].disbursed = _sumAmount(paymentsForUniProgram(u.id, prog));
    });
  });
  if (typeof RESEARCHERS !== 'undefined') {
    RESEARCHERS.forEach(r => {
      const sum = _sumAmount(paymentsForResearcher(r.name_en || r.name || ''));
      // Researchers may have allocated > current disbursed; only override when we have real payments
      if (sum > 0) r.disbursed = sum;
    });
  }
  if (typeof EVM !== 'undefined') {
    EVM.forEach(e => {
      const sum = _sumAmount(paymentsForProgram(e.id));
      if (sum > 0) e.ac = sum;
    });
  }
  if (typeof SPENDING_PLANS !== 'undefined') {
    SPENDING_PLANS.forEach(sp => {
      const sum = _sumAmount(paymentsForProgram(sp.program_id));
      if (sum > 0) sp.total_spent = sum;
    });
  }
  console.log('[RDO] Money flow reconciled — PAYMENTS:', PAYMENTS.length, 'rows totalling', _sumAmount(PAYMENTS.filter(_isPaidStatus)));
}

/* Console helper — prints whether the audit trail and the headline numbers agree.
   Call after edits: rdoConsistencyCheck() */
window.rdoConsistencyCheck = function(){
  const issues = [];
  UNI_DATA.forEach(u => {
    ['postdoc','infra','hqr'].forEach(prog => {
      if (!u[prog]) return;
      const stored = u[prog].disbursed || 0;
      const computed = _sumAmount(paymentsForUniProgram(u.id, prog));
      if (stored !== computed) issues.push(`${u.name_en||u.name_ar} [${prog}] stored=${stored} computed=${computed}`);
    });
  });
  if (typeof EVM !== 'undefined') EVM.forEach(e => {
    const stored = e.ac;
    const computed = _sumAmount(paymentsForProgram(e.id));
    if (computed > 0 && stored !== computed) issues.push(`EVM[${e.id}] ac=${stored} computed=${computed}`);
  });
  if (issues.length){ console.warn('[RDO] inconsistencies:', issues); return issues; }
  console.log('[RDO] ✓ all money totals agree with PAYMENTS audit trail');
  return [];
};

/* ─────────────────────────────────────────────────────────────────
   Inline drill-down helpers: turn a name inside a row's subtitle
   into a clickable link that opens that entity's record.
   stopPropagation prevents the outer row's onclick from firing.
   ───────────────────────────────────────────────────────────────── */
function _uniLnk(u){
  if(!u) return '';
  const name = T(u.name_ar, u.name_en || u.name_ar);
  return `<span class="lnk" onclick="event.stopPropagation();openRecord('uni', ${u.id})">${escapeHtml(name)}</span>`;
}
function _resLnk(r){
  if(!r) return '';
  return `<span class="lnk" onclick="event.stopPropagation();openRecord('researcher', ${r.id})">${escapeHtml(r.name)}</span>`;
}
function _resLnkByName(name){
  // For payment/invoice rows that store researcher as a free-text name
  const r = (typeof RESEARCHERS !== 'undefined') && RESEARCHERS.find(x => x.name === name);
  if(!r) return escapeHtml(name||'');
  return _resLnk(r);
}

/* ─────────────────────────────────────────────────────────────────
   Generic filter-tab helpers used by every register view below.
   ───────────────────────────────────────────────────────────────── */
window._regFilters = window._regFilters || {};
function getRegFilter(key, dflt){ return window._regFilters[key] || (dflt||'all'); }
function setRegFilter(key, val, detailKey){
  window._regFilters[key] = val;
  renderDetail(detailKey);
}
function _kpiTab(active, onclick, icon, bg, ar, en, val, sub){
  const style = 'cursor:pointer;'+(active?'outline:3px solid #6557F5;outline-offset:-3px;background:rgba(101,87,245,0.06)':'');
  return `<div class="kpi-card" onclick="${onclick}" style="${style}" title="${T('عرض','Show')}: ${T(ar,en)}">
    <div class="kpi-icon ${bg}">${icon}</div>
    <div class="kpi-lbl">${T(ar,en)}</div>
    <div class="kpi-val">${val}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}
function _emptyRow(ar, en){
  return `<div class="row" style="opacity:0.55"><div class="row-icon bg-research">—</div><div class="row-body"><div class="row-title">${T(ar,en)}</div><div class="row-sub">${T('جرّب تبويباً آخر بالأعلى','Try another tab above')}</div></div></div>`;
}

function evmView(){

  const totalAc = EVM.reduce((s,e)=>s+e.ac,0);
  const portSpi = totalPv ? totalEv/totalPv : 0;

  const portEac = portCpi ? totalBac/portCpi : totalBac;
  return {

      <div class="kpi-card" onclick="onAppClick('tetco-payments')"><div class="kpi-icon bg-payment">💳</div><div class="kpi-lbl">AC</div><div class="kpi-val">${fmt(totalAc)}</div><div class="kpi-sub">${T('التكلفة الفعلية','Actual Cost')}</div></div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card" onclick="onAppClick('ministry-spending')"><div class="kpi-icon ${portSpi>=1?'bg-spend':'bg-tasks'}">⏱️</div><div class="kpi-lbl">SPI</div><div class="kpi-val">${portSpi.toFixed(2)}</div><div class="kpi-sub ${portSpi>=1?'':'bad'}">${portSpi>=1?T('على الجدول','On Schedule'):T('متأخر عن الجدول','Behind Schedule')}</div></div>
      <div class="kpi-card" onclick="onAppClick('ministry-spending')"><div class="kpi-icon ${portCpi>=1?'bg-spend':'bg-tasks'}">💰</div><div class="kpi-lbl">CPI</div><div class="kpi-val">${portCpi.toFixed(2)}</div><div class="kpi-sub ${portCpi>=1?'':'bad'}">${portCpi>=1?T('ضمن الميزانية','Under Budget'):T('تجاوز الميزانية','Over Budget')}</div></div>
      <div class="kpi-card" onclick="onAppClick('ministry-spending')"><div class="kpi-icon bg-progress">🎯</div><div class="kpi-lbl">EAC</div><div class="kpi-val">${fmt(Math.round(portEac))}</div><div class="kpi-sub">${T('التقدير عند الإنجاز','Estimate at Completion')}</div></div>
      <div class="kpi-card" onclick="onAppClick('ministry-spending')"><div class="kpi-icon bg-budget">📐</div><div class="kpi-lbl">VAC</div><div class="kpi-val">${fmt(Math.round(totalBac-portEac))}</div><div class="kpi-sub">${T('الفرق عند الإنجاز','Variance at Completion')}</div></div>

    <div class="section-h">${T('مؤشرات كل برنامج','Per-Program Indicators')}</div>
    <div class="list">` +
    EVM.map(e=>{
      const c = evmCalc(e);
      const prog = PROGRAMS.find(p=>p.id===e.id);

    }).join('') + `</div>`
  };

/* Circular progress gauge (open arc, ~270°) — color-coded by RAG */
function gaugeChart(pct, opts){
  opts = opts || {};
  const size = opts.size || 110;
  const stroke = opts.stroke || 9;
  const r = (size - stroke) / 2 - 2;
  const cx = size/2, cy = size/2;
  const start = 135, end = 405;        // 270° sweep
  const sweep = end - start;
  const filled = sweep * (Math.max(0, Math.min(100, pct)) / 100);
  const polar = (deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  const arcPath = (from, to) => {
    const [x1,y1] = polar(from), [x2,y2] = polar(to);
    const large = (to - from) > 180 ? 1 : 0;
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  };
  const color = opts.color || (pct>=70?'#22a060':pct>=30?'#f59e0b':'#ef4444');
  const trackColor = opts.trackColor || '#fde2e0';
  const trackColorOk = opts.trackColor || '#d8eddf';
  const finalTrack = pct>=70 ? trackColorOk : (pct>=30 ? '#fde7c4' : trackColor);
  return `<svg class="gauge" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <path d="${arcPath(start, end)}" fill="none" stroke="${finalTrack}" stroke-width="${stroke}" stroke-linecap="round"/>
    <path d="${arcPath(start, start + filled)}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" class="gauge-num" fill="${color}" font-family="Cairo,Inter,system-ui">${Math.round(pct)}%</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" class="gauge-lbl" fill="#9a99b3" font-family="Cairo,Inter,system-ui" letter-spacing="1">PROGRESS</text>
  </svg>`;
}

/* Tabs bar — list of {key,label,count?} */
function tabsBar(tabs, active){
  return `<div class="detail-tabs">${tabs.map(t=>{
    const isActive = t.key===active ? 'active':'';
    const cnt = (typeof t.count==='number') ? `<span class="count">${t.count}</span>` : '';
    return `<button class="detail-tab ${isActive}" onclick="switchDetailTab('${t.key}')">${t.label}${cnt}</button>`;
  }).join('')}</div>`;
}
function switchDetailTab(key){
  document.querySelectorAll('.detail-tab').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim().toLowerCase().includes(key.toLowerCase()) || b.getAttribute('onclick')===`switchDetailTab('${key}')`);
  });
  document.querySelectorAll('[data-tabpane]').forEach(p=>{
    p.style.display = p.getAttribute('data-tabpane')===key ? '' : 'none';
  });
}

function raidLetterChips(counts){
  counts = counts || {};
  const map = [['r','R'],['a','A'],['i','I'],['d','D'],['c','C'],['f','F']];
  return `<span class="raid-chips">${map.map(([k,letter])=>{
    const v = counts[k]||0;
    return `<span class="rc r-${k} ${v?'has':''}" title="${letter}: ${v}">${letter}</span>`;
  }).join('')}</span>`;
}

/* ── INLINE SVG CHART HELPERS (no external libs) ── */
function donutChart(slices, total, size){
  size = size || 180;
  const cx = size/2, cy = size/2, r = size/2 - 14, sw = 22;
  const C = 2*Math.PI*r;
  let acc = 0;
  const total2 = total || slices.reduce((s,x)=>s+x.value,0) || 1;
  const segs = slices.map((s,i)=>{
    const frac = s.value/total2;
    const dash = frac*C;
    const gap = C-dash;
    const offset = -acc*C;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
  }).join('');
  const center = `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="22" font-weight="800" fill="#0a0820" font-family="Cairo,Inter,system-ui">${total2>=1e6?(total2/1e6).toFixed(1)+'M':total2>=1e3?(total2/1e3).toFixed(0)+'K':total2}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#6b6a85" font-family="Cairo,Inter,system-ui" letter-spacing="1">SAR</text>`;
  return `<svg class="chart-svg" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="max-width:${size}px;margin:0 auto">${segs}${center}</svg>`;
}
function donutLegend(slices, total){
  const total2 = total || slices.reduce((s,x)=>s+x.value,0) || 1;
  return `<div class="donut-legend">${slices.map(s=>{
    const pct = Math.round(s.value/total2*100);
    return `<div class="leg"><div class="lab"><span class="swatch" style="background:${s.color}"></span>${s.label}</div><div class="val">${fmt(s.value)} <span style="color:var(--mute2);font-weight:600">(${pct}%)</span></div></div>`;
  }).join('')}</div>`;
}
function barListMini(items){
  const maxV = Math.max(1, ...items.map(i=>i.value));
  return `<div class="bar-list-mini">${items.map(i=>{
    const w = Math.round(i.value/maxV*100);
    return `<div class="row"><div class="lab" title="${escapeHtml(i.label)}">${i.label}</div><div class="track"><span class="fill" style="width:${w}%;${i.color?'background:'+i.color:''}"></span></div><div class="num">${fmt(i.value)}</div></div>`;
  }).join('')}</div>`;
}
function sparkline(values, w, h, color){
  w = w || 80; h = h || 24; color = color || '#6557F5';
  if(!values || values.length<2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min)||1;
  const stepX = w/(values.length-1);
  const points = values.map((v,i)=>`${(i*stepX).toFixed(1)},${(h - (v-min)/range*(h-2)-1).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle"><polyline fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" points="${points}"/></svg>`;
}

/* ── SCHEDULES (Gantt-style timeline) ── */
function scheduleView(){
  // Aggregate all bars: programs + spending plan phases
  const items = [];
  PROGRAMS.forEach((p,idx)=>{
    if(!p.start || !p.end) return;
    const evm = EVM.find(e=>e.id===p.id);
    const c = evm ? evmCalc(evm) : null;
    let rag = 'plan';
    if(c){ rag = c.cpi>=1 && c.spi>=1 ? 'on' : c.cpi<0.9 || c.spi<0.9 ? 'off' : 'at'; }
    items.push({label:T(p.ar,p.en), icon:p.icon, bg:p.bg, start:p.start, end:p.end, actualPct:evm?Math.round(evm.ev/evm.bac*100):0, rag, click:`openProgramRecord(${idx})`});
  });
  SPENDING_PLANS.forEach(sp=>{
    sp.phases.forEach(ph=>{
      items.push({label:T(ph.name_ar+' — '+sp.title_ar.slice(0,18), ph.name_en+' — '+sp.title_en.slice(0,28)),
        icon:'💸', bg:'bg-budget', start:ph.start, end:ph.end,
        actualPct: ph.planned?Math.round((ph.actual/ph.planned)*100):0,
        rag: ph.status==='completed'?'on':ph.status==='in-progress'?'at':'plan',
        click:`openRecord('spending', ${sp.id})`});
    });
  });

  // Compute axis bounds
  const allDates = items.flatMap(i=>[new Date(i.start), new Date(i.end)]);
  const minD = new Date(Math.min(...allDates));
  const maxD = new Date(Math.max(...allDates));
  // Round to whole years for cleaner ticks
  minD.setMonth(0,1); minD.setHours(0,0,0,0);
  maxD.setMonth(11,31); maxD.setHours(23,59,59,999);
  const totalSpan = maxD - minD;
  const today = new Date();
  const nowPct = ((today - minD) / totalSpan * 100);
  // Year ticks
  const startY = minD.getFullYear(), endY = maxD.getFullYear();
  const years = [];
  for(let y=startY;y<=endY;y++) years.push(y);

  function pctOf(iso){
    const d = new Date(iso);
    return Math.max(0, Math.min(100, (d - minD) / totalSpan * 100));
  }

  return {
    title_ar:'الجدول الزمني', title_en:'Schedules',
    html: `
      <div class="kpi-grid">
        <div class="kpi-card" onclick="onAppClick('ministry-programs')"><div class="kpi-icon bg-program">📦</div><div class="kpi-lbl">${T('بنود الجدول','Timeline Items')}</div><div class="kpi-val">${items.length}</div></div>
        <div class="kpi-card" onclick="onAppClick('ministry-programs')"><div class="kpi-icon bg-info">📅</div><div class="kpi-lbl">${T('من','From')}</div><div class="kpi-val">${minD.getFullYear()}</div></div>
        <div class="kpi-card" onclick="onAppClick('ministry-programs')"><div class="kpi-icon bg-info">📅</div><div class="kpi-lbl">${T('إلى','To')}</div><div class="kpi-val">${maxD.getFullYear()}</div></div>
        <div class="kpi-card" onclick="onAppClick('ministry-programs')"><div class="kpi-icon bg-tasks">🕒</div><div class="kpi-lbl">${T('اليوم','Today')}</div><div class="kpi-val">${nowPct.toFixed(0)}%</div><div class="kpi-sub">${T('من المدة','of timeline')}</div></div>
      </div>
      <div class="section-h">${T('مخطط جانت — البرامج وخطط الإنفاق','Gantt — Programs & Spending Plan Phases')}</div>
      <div class="gantt-wrap">
        <div class="gantt-axis">
          ${years.map(y=>`<span class="tick">${y}</span>`).join('')}
        </div>
        ${items.map(it=>{
          const left = pctOf(it.start);
          const width = Math.max(1, pctOf(it.end) - left);
          const actualW = width * (it.actualPct/100);
          const cls = it.rag==='on'?'bar-on':it.rag==='at'?'bar-at':it.rag==='off'?'bar-off':'bar-plan';
          return `<div class="gantt-row" onclick="${it.click}">
            <div class="gantt-label">
              <div class="glabel-icon ${it.bg}">${it.icon}</div>
              <div class="glabel-text">${it.label}</div>
            </div>
            <div class="gantt-track" style="position:relative">
              <div class="gantt-bar ${cls}" style="left:${left}%;width:${width}%" title="${it.start} → ${it.end}">${it.actualPct}%</div>
              ${it.actualPct>0 && it.actualPct<100 ? `<div class="gantt-actual" style="left:${left}%;width:${actualW}%"></div>` : ''}
              ${nowPct>=0 && nowPct<=100 ? `<div class="gantt-now-line" style="left:${nowPct}%"></div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="form-note" style="margin-top:14px;text-align:center">${T('🟢 على المسار  •  🟡 في خطر  •  🔴 خارج المسار  •  ⚪️ مخطط  •  الشريط الأعلى = المخطط، الشريط السفلي الأسود = المنجز','🟢 On Track  •  🟡 At Risk  •  🔴 Off Track  •  ⚪️ Planned  •  Top bar = planned, bottom black bar = actual progress')}</div>
    `
  };
}

let currentForm = null;
function openForm(formKey){
  const def = FORMS[formKey] && FORMS[formKey]();
  if(!def){ toast(T('النموذج غير متوفر','Form not available'), true); return; }
  currentForm = formKey;
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <div class="modal-hd">
      <span class="modal-title">${def.title}</span>
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    ${def.body}
    <div class="form-actions">
      <button class="btn btn-sec" onclick="closeForm()">${T('إلغاء','Cancel')}</button>
      <button class="btn btn-pri" onclick="submitForm()">💾 ${T('حفظ','Save')}</button>
    </div>
  `;
  document.getElementById('modalRoot').classList.add('open');
}

function submitForm(){
  if(!currentForm) return;
  const def = FORMS[currentForm]();
  const ok = def.submit();
  if(ok !== false){
    closeForm();
    // re-render the current page if it's a list view
    const top = stack[stack.length-1];
    if(top && top.type==='detail') renderDetail(top.key);
    else if(top && top.type==='folder') renderFolder(top.key);
  }
}

function closeForm(){
  document.getElementById('modalRoot').classList.remove('open');
  currentForm = null;
}

document.getElementById('modalRoot').addEventListener('click', (e)=>{
  if(e.target.id === 'modalRoot') closeForm();
});

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show'+(isErr?' err':'');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ════════════════════════════════════════════
   RECORD (drill-down) RENDERER
════════════════════════════════════════════ */
function renderRecord(type, id){
  const r = getRecord(type, id);
  if(!r){
    document.getElementById('page').innerHTML = `<div class="empty"><div class="ei">❓</div><p>${T('السجل غير موجود','Record not found')}</p></div>`;
    return;
  }
  clearFab();
  setHeader(T(r._titleAr, r._titleEn), T(r._subAr||'', r._subEn||''), true);

  // Selis-style hero for entities with progress (program / initiative / researcher / spending)
  const useSelis = ['program','initiative','researcher','spending','objective','kpi'].includes(type);
  let heroHtml;
  if(useSelis){
    let progress=0, planned=100, spi=0, budget=0, planned2=100, cpi=0, phase='Planning', owner='', sector='', health='Off Track', priority='Medium';
    if(type==='program'){
      const evm = EVM.find(e=>e.id===r.id);
      const c = evm ? evmCalc(evm) : {spi:0,cpi:0};
      progress = evm ? Math.round(evm.ev/evm.bac*100) : 0;
      planned = evm ? Math.round(evm.pv/evm.bac*100) : 0;
      budget = evm ? Math.round(evm.ac/evm.bac*100) : 0;
      planned2 = planned;
      spi = c.spi; cpi = c.cpi;
      phase = r.phase || 'Planning';
      owner = r.owner; sector = r.sponsor;
      health = (c.spi>=1 && c.cpi>=1) ? T('على المسار','On Track') : (c.spi<0.9||c.cpi<0.9) ? T('خارج المسار','Off Track') : T('في خطر','At Risk');
    } else if(type==='initiative' || type==='objective'){
      progress = r.progress || 0;
      planned = 100; budget = progress; planned2 = 100;
      phase = r.rag==='realized'?'Done':r.rag==='on-track'?'Execution':r.rag==='at-risk'?'Planning':'Initiation';
      owner = r.owner; sector = r.sponsor;
      health = ragLabel(r.rag);
    } else if(type==='researcher'){
      progress = r.progress || 0;
      planned = 100; budget = r.allocated ? Math.round(r.disbursed/r.allocated*100) : 0; planned2 = 100;
      phase = r.phase===4?'Closure':r.phase===3?'Execution':r.phase===2?'Planning':'Initiation';
      owner = r.name_en; sector = r.spec;
      health = r.status==='active'?T('على المسار','On Track'):r.status==='pending'?T('في خطر','At Risk'):T('مكتمل','Completed');
    } else if(type==='spending'){
      const e = spPlanEvm(r);
      progress = Math.round(e.ev/r.total_budget*100);
      planned = Math.round(e.pv/r.total_budget*100);
      budget = Math.round(e.ac/r.total_budget*100);
      planned2 = planned; spi = e.spi; cpi = e.cpi;
      phase = e.timeElapsedPct<25?'Initiation':e.timeElapsedPct<50?'Planning':e.timeElapsedPct<90?'Execution':'Closure';
      owner = r.owner; sector = r.sponsor;
      health = (e.scheduleStatus==='on'&&e.budgetStatus==='on')?T('على المسار','On Track'):(e.scheduleStatus==='behind'||e.budgetStatus==='over')?T('خارج المسار','Off Track'):T('في خطر','At Risk');
    } else if(type==='kpi'){
      progress = r.target ? Math.min(100, Math.round((r.current-r.baseline)/(r.target-r.baseline)*100)) : 0;
      planned = 100; budget = progress; planned2 = 100;
      phase = r.rag==='realized'?'Done':r.rag==='on-track'?'Execution':'Planning';
      owner = r.owner; sector = r.period;
      health = ragLabel(r.rag);
    }
    const delta = progress - planned;
    const delta2 = budget - planned2;
    const idArg = typeof id==='number' ? String(id) : "'"+id+"'";
    heroHtml = selisHero(r, {progress, planned, delta, spi, budget, planned2, delta2, cpi, phase, owner, sector, health, priority,
      editClick: TYPE_ARRAY_MAP[type] ? `editRecord('${type}', ${idArg})` : '',
      deleteClick: TYPE_ARRAY_MAP[type] ? `deleteRecord('${type}', ${idArg})` : ''});
  } else {
    heroHtml = recHero(type, r);
  }

  // Build tabs for related sections
  const tabs = buildDetailTabs(type, r);
  const tabsHtml = tabs.length ? tabsBar(tabs, tabs[0].key) : '';
  const tabsContent = tabs.length ? tabs.map((t,i)=>`<div data-tabpane="${t.key}" style="${i===0?'':'display:none'}">${t.html}</div>`).join('') : '';

  document.getElementById('page').innerHTML = `
    ${heroHtml}
    ${tabsHtml}
    ${tabsContent}
    ${!tabs.length ? statusFlowHtml(type, r) : ''}
    ${!tabs.length ? rawFieldsHtml(type, r) : ''}
    ${!tabs.length ? linkedRecordsHtml(type, r) : ''}
    ${commentsHtml(type, id)}
  `;
  // wire comment input + @mention autocomplete
  wireCommentInput(type, id);
}
