function wireCommentInput(type, id){
  const inp = document.getElementById('commInput');
  if(!inp) return;
  const picker = document.getElementById('mentionPicker');
  const pool = peoplePool();
  let mentions = [];          // running list of {id, name, email, source} for THIS comment
  let pickerActive = false;
  let pickerStart = -1;       // index of the '@' in the input value
  let highlight = 0;          // currently highlighted row in dropdown

  function closePicker(){
    pickerActive = false;
    picker.style.display = 'none';
    picker.innerHTML = '';
  }

  function renderPicker(query){
    const q = (query||'').toLowerCase();
    const matches = pool.filter(p =>
      !mentions.find(m => m.key === p.key) &&
      (q === '' || p.name.toLowerCase().includes(q) || p.label.toLowerCase().includes(q))
    ).slice(0, 8);
    if(!matches.length){
      picker.innerHTML = `<div class="mention-empty">${T('لا توجد نتائج — تأكد من أن الشخص مسجل ولديه بريد إلكتروني','No matches — make sure the person is in the team/stakeholder pool with an email')}</div>`;
      picker.style.display = 'block';
      pickerActive = true;
      return;
    }
    if(highlight >= matches.length) highlight = 0;
    picker.innerHTML = matches.map((p,i) => {
      const ini = p.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
      return `<div class="mention-row${i===highlight?' active':''}" data-key="${p.key}">
        <div class="mention-avatar">${ini}</div>
        <div class="mention-text">
          <div class="mention-name">${escapeHtml(p.name)} <span class="mention-source">${p.source==='team'?'👥':'🎯'}</span></div>
          <div class="mention-sub">${escapeHtml(p.label)} • ${escapeHtml(p.email)}</div>
        </div>
      </div>`;
    }).join('');
    picker.style.display = 'block';
    pickerActive = true;
    // Click handlers
    picker.querySelectorAll('.mention-row').forEach((row, i) => {
      row.addEventListener('mousedown', e => {  // mousedown so it fires before input blur
        e.preventDefault();
        choose(matches[i]);
      });
    });
    picker._matches = matches;
  }

  function choose(person){
    if(!person) return;
    // Replace the @<query> token in the input with @<FullName> + space
    const v = inp.value;
    const head = v.slice(0, pickerStart);
    const tail = v.slice(inp.selectionStart || v.length);
    inp.value = head + '@' + person.name + ' ' + tail;
    const pos = (head + '@' + person.name + ' ').length;
    inp.setSelectionRange(pos, pos);
    mentions.push(person);
    closePicker();
    inp.focus();
  }

  inp.addEventListener('input', () => {
    const cursor = inp.selectionStart || 0;
    const before = inp.value.slice(0, cursor);
    const at = before.lastIndexOf('@');
    if(at < 0 || (at > 0 && /[\w]/.test(before[at-1]))){
      closePicker(); return;
    }
    const seg = before.slice(at+1);
    if(/\s/.test(seg)){ closePicker(); return; }   // whitespace ends the token
    pickerStart = at;
    renderPicker(seg);
  });

  inp.addEventListener('keydown', e => {
    if(pickerActive){
      const matches = picker._matches || [];
      if(e.key === 'ArrowDown'){ e.preventDefault(); highlight = Math.min(matches.length-1, highlight+1); renderPicker(inp.value.slice(pickerStart+1, inp.selectionStart||inp.value.length)); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); highlight = Math.max(0, highlight-1); renderPicker(inp.value.slice(pickerStart+1, inp.selectionStart||inp.value.length)); return; }
      if(e.key === 'Enter' || e.key === 'Tab'){
        if(matches.length){ e.preventDefault(); choose(matches[highlight]); return; }
      }
      if(e.key === 'Escape'){ e.preventDefault(); closePicker(); return; }
    }
    if(e.key === 'Enter' && !e.shiftKey && !pickerActive){ e.preventDefault(); send(); }
  });
  inp.addEventListener('blur', () => setTimeout(closePicker, 120));

  function send(){
    const text = inp.value.trim();
    if(!text){ return; }
    const key = type+':'+id;
    if(!COMMENTS[key]) COMMENTS[key] = [];
    // Only keep mentions whose names actually appear in the final text
    const finalMentions = mentions.filter(m => new RegExp('@'+m.name.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&'),'i').test(text));
    const comment = {
      id: Date.now(),
      author: 'Dani Sinai',
      role: 'coordinator',
      text,
      date: new Date().toISOString().slice(0,10),
      mentions: finalMentions.map(m => ({id:m.id, name:m.name, email:m.email, source:m.source}))
    };
    COMMENTS[key].push(comment);
    inp.value = '';
    mentions = [];
    if(finalMentions.length){
      notifyMentions(finalMentions, text, type, id, comment.author).catch(err =>
        console.warn('[RDO] notification dispatch error:', err)
      );
    }
    renderRecord(type, id);
    toast(finalMentions.length
      ? T(`تم النشر — تم إشعار ${finalMentions.length} شخص ✓`, `Posted — notified ${finalMentions.length} people ✓`)
      : T('تمت إضافة التعليق ✓','Comment posted ✓')
    );
  }

  document.getElementById('commSend').addEventListener('click', send);
}

/* Build tab panes for the Selis-style detail view */
function buildDetailTabs(type, r){
  const tabs = [];
  // Universal tabs: Overview (raw fields), Comments — others depending on entity
  tabs.push({key:'overview', label:T('نظرة عامة','Overview'), html: rawFieldsHtml(type, r) + (statusFlowHtml(type, r)||'')});

  if(type==='program'){
    const myKpis = KPIS.filter(k=>k.program_id===r.id);
    const myInits = INITIATIVES.filter(i=>i.program_id===r.id);
    const myBenefits = BENEFITS.filter(b=>b.program_id===r.id);
    const myRisks = RISKS.filter(x=>x.program_id===r.id);
    const myIssues = ISSUES.filter(x=>x.program_id===r.id);
    const myDecisions = DECISIONS.filter(x=>x.program_id===r.id);
    const myChanges = CHANGES.filter(x=>x.program_id===r.id);
    const myLessons = LESSONS.filter(x=>x.program_id===r.id);
    const myContracts = CONTRACTS.filter(x=>x.program===r.id);
    const myAchievements = ACHIEVEMENTS.filter(x=>x.program_id===r.id);
    if(myKpis.length) tabs.push({key:'kpis', label:T('المؤشرات','KPIs'), count:myKpis.length, html: tabKpis(myKpis)});
    if(myInits.length) tabs.push({key:'initiatives', label:T('المبادرات','Initiatives'), count:myInits.length, html: tabInitiatives(myInits)});
    if(myBenefits.length) tabs.push({key:'benefits', label:T('المنافع','Benefits'), count:myBenefits.length, html: tabBenefits(myBenefits)});
    if(myRisks.length) tabs.push({key:'risks', label:T('المخاطر','Risks'), count:myRisks.length, html: tabSimpleList(myRisks,'risk','⚠️','bg-tasks',(x)=>`${x.category} • ${x.level}`)});
    if(myIssues.length) tabs.push({key:'issues', label:T('المشكلات','Issues'), count:myIssues.length, html: tabSimpleList(myIssues,'issue','🚩','bg-research',(x)=>`${x.severity} • ${x.status}`)});
    if(myDecisions.length) tabs.push({key:'decisions', label:T('القرارات','Decisions'), count:myDecisions.length, html: tabSimpleList(myDecisions,'decision','🗳️','bg-approval',(x)=>`${x.approver} • ${x.date}`)});
    if(myChanges.length) tabs.push({key:'changes', label:T('التغييرات','Changes'), count:myChanges.length, html: tabSimpleList(myChanges,'change','🔁','bg-progress',(x)=>`${x.change_type} • ${x.status}`)});
    if(myLessons.length) tabs.push({key:'lessons', label:T('الدروس','Lessons'), count:myLessons.length, html: tabSimpleList(myLessons,'lesson','💡','bg-invoice',(x)=>`${x.category} • ${x.author}`)});
    if(myContracts.length) tabs.push({key:'agreements', label:T('الاتفاقيات','Agreements'), count:myContracts.length, html: tabSimpleList(myContracts,'contract','📄','bg-contract',(x)=>`${fmt(x.amount)} SAR • ${x.status}`,(x)=>x.kind==='tetco-uni'?'Tetco↔Uni':'Uni↔Researcher')});
    if(myAchievements.length) tabs.push({key:'achievements', label:T('الإنجازات','Achievements'), count:myAchievements.length, html: tabSimpleList(myAchievements,'achievement','🏅','bg-achieve',(x)=>`${x.category} • ${x.date}`)});
    // Schedules tab — Gantt for this program's spending plan
    const myPlan = SPENDING_PLANS.find(sp=>sp.program_id===r.id);
    if(myPlan) tabs.push({key:'schedules', label:T('الجداول','Schedules'), html: tabSchedule(myPlan)});
  }
  else if(type==='objective'){
    const myKpis = KPIS.filter(k=>k.objective_id===r.id);
    const myInits = INITIATIVES.filter(i=>i.objective_id===r.id);
    if(myKpis.length) tabs.push({key:'kpis', label:T('المؤشرات','KPIs'), count:myKpis.length, html: tabKpis(myKpis)});
    if(myInits.length) tabs.push({key:'initiatives', label:T('المبادرات','Initiatives'), count:myInits.length, html: tabInitiatives(myInits)});
  }
  else if(type==='spending'){
    tabs.push({key:'phases', label:T('المراحل','Phases'), count:r.phases.length, html: tabPhases(r)});
  }
  else if(type==='researcher'){
    const myPays = PAYMENTS.filter(p=>p.researcher.includes(r.name_en.replace('Dr. ','').split(' ')[0]));
    if(myPays.length) tabs.push({key:'payments', label:T('الدفعات','Payments'), count:myPays.length, html: tabSimpleList(myPays,'payment','💳','bg-payment',(x)=>`Tranche ${x.tranche} • ${fmt(x.amount)} SAR`,(x)=>x.date)});
  }

  // Linked tab — anything else cross-referenced (universities, etc.)
  const linkedHtml = linkedRecordsHtml(type, r);
  if(linkedHtml && linkedHtml.length>40) tabs.push({key:'linked', label:T('روابط','Linked'), html: linkedHtml});

  return tabs;
}

function tabKpis(items){
  return `<div class="list">${items.map(k=>{
    const pct = k.target ? Math.min(100, Math.round((k.current-k.baseline)/(k.target-k.baseline)*100)) : 0;
    const cls = k.rag==='on-track'?'pill-ok':k.rag==='at-risk'?'pill-warn':k.rag==='off-track'?'pill-bad':'pill-info';
    return `<div class="row" onclick="openRecord('kpi', ${k.id})">
      <div class="row-icon bg-kpi">${renderIcon('kpi')}</div>
      <div class="row-body">
        <div class="row-title">${T(k.title_ar,k.title_en)}</div>
        <div class="row-sub">${k.current}/${k.target} ${T(k.unit_ar,k.unit_en)} • ${k.period}</div>
        <div class="bar"><i class="${pct>=70?'ok':pct>=30?'warn':'bad'}" style="width:${Math.max(0,pct)}%"></i></div>
      </div>
      <div class="row-meta"><span class="row-pill ${cls}">${ragLabel(k.rag)}</span><strong>${pct}%</strong></div>
    </div>`;
  }).join('')}</div>`;
}

function tabPhases(plan){
  return `<div class="list">${plan.phases.map((ph,idx)=>{
    const pct = ph.planned ? Math.round(ph.actual/ph.planned*100) : 0;
    const pill = ph.status==='completed'?'pill-ok':ph.status==='in-progress'?'pill-warn':'pill-info';
    return `<div class="row">
      <div class="row-icon bg-budget">${renderIcon('schedule')}</div>
      <div class="row-body">
        <div class="row-title">${T(ph.name_ar,ph.name_en)}</div>
        <div class="row-sub">${ph.start} → ${ph.end} • ${T('مخطط','Planned')}: ${fmt(ph.planned)} • ${T('فعلي','Actual')}: ${fmt(ph.actual)}</div>
        <div class="bar"><i class="${pct>=70?'ok':pct>=30?'warn':'bad'}" style="width:${pct}%"></i></div>
      </div>
      <div class="row-meta"><span class="row-pill ${pill}">${ph.status}</span></div>
    </div>`;
  }).join('')}</div>`;
}
function tabSchedule(plan){
  // Render a mini Gantt for the plan's phases
  const allDates = plan.phases.flatMap(p=>[new Date(p.start), new Date(p.end)]);
  const minD = new Date(Math.min(...allDates));
  const maxD = new Date(Math.max(...allDates));
  const totalSpan = maxD - minD || 1;
  const today = new Date();
  const nowPct = ((today - minD) / totalSpan * 100);
  const pctOf = (iso) => {
    const d = new Date(iso);
    return Math.max(0, Math.min(100, (d - minD) / totalSpan * 100));
  };
  const startY = minD.getFullYear(), endY = maxD.getFullYear();
  const years = []; for(let y=startY;y<=endY;y++) years.push(y);
  return `
    <div class="gantt-wrap">
      <div class="gantt-axis">${years.map(y=>`<span class="tick">${y}</span>`).join('')}</div>
      ${plan.phases.map(ph=>{
        const left = pctOf(ph.start);
        const width = Math.max(1, pctOf(ph.end) - left);
        const actualPct = ph.planned ? Math.round(ph.actual/ph.planned*100) : 0;
        const cls = ph.status==='completed'?'bar-on':ph.status==='in-progress'?'bar-at':'bar-plan';
        return `<div class="gantt-row">
          <div class="gantt-label">
            <div class="glabel-icon bg-budget">${renderIcon('schedule')}</div>
            <div class="glabel-text">${T(ph.name_ar,ph.name_en)}</div>
          </div>
          <div class="gantt-track" style="position:relative">
            <div class="gantt-bar ${cls}" style="left:${left}%;width:${width}%">${actualPct}%</div>
            ${nowPct>=0 && nowPct<=100 ? `<div class="gantt-now-line" style="left:${nowPct}%"></div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function getRecord(type, id){
  let r;
  switch(type){
    case 'uni':       r = UNI_DATA.find(x=>x.id===id); break;
    case 'researcher':r = RESEARCHERS.find(x=>x.id===id); break;
    case 'payment':   r = PAYMENTS.find(x=>x.id===id); break;
    case 'comm':      r = COMMS.find(x=>x.id===id); break;
    case 'invoice':   r = INVOICES.find(x=>x.id===id); break;
    case 'team':      r = TEAM.find(x=>x.id===id); break;
    case 'approval':  r = APPROVALS.find(x=>x.id===id); break;
    case 'task':      r = TASKS.find(x=>x.id===id); break;
    case 'policy':    r = POLICIES.find(x=>x.id===id); break;
    case 'program':   r = (typeof id==='number' && PROGRAMS[id]) ? PROGRAMS[id] : PROGRAMS.find(x=>x.id===id); break;
    case 'contract':  r = CONTRACTS.find(x=>x.id===id); break;
    case 'benefit':   r = BENEFITS.find(x=>x.id===id); break;
    case 'risk':      r = RISKS.find(x=>x.id===id); break;
    case 'issue':     r = ISSUES.find(x=>x.id===id); break;
    case 'decision':  r = DECISIONS.find(x=>x.id===id); break;
    case 'change':    r = CHANGES.find(x=>x.id===id); break;
    case 'lesson':    r = LESSONS.find(x=>x.id===id); break;
    case 'stakeholder':r = STAKEHOLDERS.find(x=>x.id===id); break;
    case 'objective':  r = OBJECTIVES.find(x=>x.id===id); break;
    case 'kpi':        r = KPIS.find(x=>x.id===id); break;
    case 'initiative': r = INITIATIVES.find(x=>x.id===id); break;
    case 'achievement':r = ACHIEVEMENTS.find(x=>x.id===id); break;
    case 'vision':     r = VISION.id===id ? VISION : null; break;
    case 'mission':    r = MISSION.id===id ? MISSION : null; break;
    case 'audit':      r = AUDIT.find(x=>x.id===id); break;
    case 'spending':   r = SPENDING_PLANS.find(x=>x.id===id); break;
    case 'addendum':   r = ADDENDUMS.find(x=>x.id===id); break;
  }
  if(!r) return null;
  return decorateForHero(type, r);
}

function deleteRecord(type, id){
  if(!confirm(T('هل أنت متأكد من الحذف؟ لا يمكن التراجع عن هذا الإجراء.','Are you sure you want to delete this? This cannot be undone.'))) return;
  const arr = getTypeArray(type);
  if(!arr) { toast(T('لا يمكن الحذف لهذا النوع','Cannot delete this type'), true); return; }
  const idx = arr.findIndex(x=>x.id===id);
  if(idx<0){ toast(T('السجل غير موجود','Record not found'), true); return; }
  arr.splice(idx,1);
  AUDIT.push({id:AUDIT.length+1, type:'delete', entity:type, entity_id:id,
    by:'Dani Sinai', date:new Date().toISOString().slice(0,10),
    summary_en:type+' #'+id+' deleted', summary_ar:'حذف '+type+' #'+id});
  // Turso write-through for universities
  if(type==='uni' && typeof tursoDeleteUniversity === 'function'){ tursoDeleteUniversity(id); }
  // If we deleted a payment, re-reconcile so totals stay correct
  if(type==='payment' && typeof reconcileMoneyFlow === 'function'){ try { reconcileMoneyFlow(); } catch(e){} }
  toast(T('تم الحذف ✓','Deleted ✓'));
  goBack();
}

/* Generic record editor — auto-builds form from current record fields */
function editRecord(type, id){
  const arr = getTypeArray(type);
  if(!arr){ toast(T('التحرير غير متاح','Edit not available'), true); return; }
  const r = arr.find(x=>x.id===id);
  if(!r){ toast(T('السجل غير موجود','Not found'), true); return; }

  // Build form body from record keys
  const skipKeys = new Set(['id','_titleAr','_titleEn','_subAr','_subEn','_icon','_bg']);
  const fields = Object.keys(r).filter(k=>!skipKeys.has(k));
  let body = `<div style="max-height:55vh;overflow-y:auto;padding-right:4px">`;
  for(const k of fields){
    const v = r[k];
    const safeId = 'ed_'+k.replace(/[^a-zA-Z0-9_]/g,'_');
    const label = (lblMapForKey(k));
    if(v && typeof v === 'object' && !Array.isArray(v)){
      body += `<div class="form-group"><label class="form-label">${label}</label><textarea class="form-input" id="${safeId}" rows="3" data-json="1">${escapeHtml(JSON.stringify(v, null, 2))}</textarea></div>`;
    } else if(Array.isArray(v)){
      body += `<div class="form-group"><label class="form-label">${label}</label><textarea class="form-input" id="${safeId}" rows="2" data-json="1">${escapeHtml(JSON.stringify(v))}</textarea></div>`;
    } else if(typeof v === 'boolean'){
      body += `<div class="form-group"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="${safeId}" ${v?'checked':''}/> ${label}</label></div>`;
    } else {
      const isDate = /^\d{4}-\d{2}-\d{2}$/.test(String(v||''));
      const inputType = typeof v === 'number' ? 'number' : (isDate ? 'date' : 'text');
      const longText = typeof v === 'string' && v.length > 80;
      if(longText) body += `<div class="form-group"><label class="form-label">${label}</label><textarea class="form-input" id="${safeId}" rows="2">${escapeHtml(String(v||''))}</textarea></div>`;
      else body += `<div class="form-group"><label class="form-label">${label}</label><input class="form-input" id="${safeId}" type="${inputType}" value="${escapeHtml(String(v??''))}"/></div>`;
    }
  }
  body += `</div>`;

  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <div class="modal-hd">
      <span class="modal-title">✏️ ${T('تعديل','Edit')} — ${T(r._titleAr||'',r._titleEn||'')||type+'#'+id}</span>
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    ${body}
    <div class="form-actions">
      <button class="btn btn-sec" onclick="closeForm()">${T('إلغاء','Cancel')}</button>
      <button class="btn btn-pri" onclick="submitEditRecord('${type}', ${id})">💾 ${T('حفظ التغييرات','Save Changes')}</button>
    </div>
  `;
  document.getElementById('modalRoot').classList.add('open');
  currentForm = '__edit__';
}

function submitEditRecord(type, id){
  const arr = getTypeArray(type);
  if(!arr) return;
  const r = arr.find(x=>x.id===id);
  if(!r) return;
  const skipKeys = new Set(['id','_titleAr','_titleEn','_subAr','_subEn','_icon','_bg']);
  const fields = Object.keys(r).filter(k=>!skipKeys.has(k));
  for(const k of fields){
    const safeId = 'ed_'+k.replace(/[^a-zA-Z0-9_]/g,'_');
    const el = document.getElementById(safeId);
    if(!el) continue;
    if(el.type==='checkbox'){ r[k] = el.checked; }
    else if(el.dataset && el.dataset.json){
      try{ r[k] = JSON.parse(el.value); }catch(e){ /* keep old */ }
    }
    else if(el.type==='number'){ r[k] = parseFloat(el.value)||0; }
    else { r[k] = el.value; }
  }
  AUDIT.push({id:AUDIT.length+1, type:'update', entity:type, entity_id:id,
    by:'Dani Sinai', date:new Date().toISOString().slice(0,10),
    summary_en:type+' #'+id+' updated', summary_ar:'تحديث '+type+' #'+id});
  // Turso write-through for universities
  if(type==='uni' && typeof tursoUpdateUniversity === 'function'){ tursoUpdateUniversity(r); }
  // If we edited a payment (amount/status), re-reconcile so derived totals follow
  if(type==='payment' && typeof reconcileMoneyFlow === 'function'){ try { reconcileMoneyFlow(); } catch(e){} }
  toast(T('تم حفظ التغييرات ✓','Changes saved ✓'));
  closeForm();
  // re-render record
  renderRecord(type, id);
}

function statusFlowHtml(type, r){
  let flowKey, currentStatus;
  if(type==='contract'){ flowKey='contract'; currentStatus = r.status; }
  else if(type==='invoice'){ flowKey='invoice'; currentStatus = r.status; }
  else if(type==='payment'){ flowKey='payment'; currentStatus = r.status; }
  else if(type==='researcher'){
    flowKey='research';
    currentStatus = r.progress===0?'not-started':r.progress<25?'started':r.progress<70?'in-progress':r.progress<100?'review':'completed';
  }
  else if(type==='risk'){ flowKey='risk'; currentStatus = r.status; }
  else if(type==='issue'){ flowKey='issue'; currentStatus = r.status; }
  else if(type==='change'){ flowKey='change'; currentStatus = r.status; }
  else if(type==='benefit'){ flowKey='benefit'; currentStatus = r.status; }
  else if(type==='objective' || type==='initiative' || type==='kpi'){ flowKey='rag'; currentStatus = r.rag; }
  if(!flowKey) return '';
  const flow = STATUS_FLOWS[flowKey];
  let curIdx = flow.findIndex(s=>s.key===currentStatus);
  if(curIdx<0) curIdx = 0;
  const steps = flow.map((s,i)=>{
    const cls = i<curIdx ? 'done' : i===curIdx ? 'curr' : '';
    return `<div class="flow-step ${cls}">
      <div class="flow-dot">${i<curIdx?'✓':i+1}</div>
      <div class="flow-lbl">${T(s.ar,s.en)}</div>
    </div>`;
  }).join('');
  return `<div class="rec-section">
    <div class="section-h">${T('مسار الحالة','Status Workflow')}</div>
    <div class="status-flow"><div class="flow-track">${steps}</div></div>
  </div>`;
}

    by:['بواسطة','By']

  const lbl = lblMap[key] ? T(lblMap[key][0],lblMap[key][1]) : key;
  let display = '';
  if(val === null || val === undefined || val === '') display = `<span class="muted">—</span>`;
  else if(key==='uni_id' && val>0){
    const u = UNI_DATA.find(x=>x.id===val);
    display = u ? `<a class="link" onclick="openRecord('uni', ${val})">${T(u.name_ar,u.name_en||u.name_ar)} →</a>` : `#${val}`;
  }
  else if(key==='researcher_id' && val>0){
    const rr = RESEARCHERS.find(x=>x.id===val);
    display = rr ? `<a class="link" onclick="openRecord('researcher', ${val})">${T(rr.name_ar,rr.name_en)} →</a>` : `#${val}`;
  }
  else if(typeof val === 'object'){
    // Render nested object as compact key:value list
    const inner = Object.entries(val).map(([k,v])=>{
      if(typeof v === 'number' && v>=1000) v = v.toLocaleString();
      return `<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line2);font-size:13px">
        <span style="color:var(--mute);font-weight:600">${k}</span>
        <span style="font-weight:600">${v}</span>
      </div>`;
    }).join('');
    display = `<div style="background:var(--bg);padding:10px 12px;border-radius:8px">${inner}</div>`;
  }
  else if(key==='status' || key==='priority'){
    const cls = (val==='active'||val==='signed'||val==='transferred'||val==='approved'||val==='completed'||val==='مشارك') ? 'pill-ok'
             : (val==='pending'||val==='pending-signing'||val==='submitted'||val==='med'||val==='warning'||val==='in-progress') ? 'pill-warn'
             : (val==='high'||val==='rejected'||val==='cancelled'||val==='not-started') ? 'pill-bad' : 'pill-info';
    display = `<span class="row-pill ${cls}">${val}</span>`;
  }
  else if(key==='progress'){
    display = `<div style="display:flex;align-items:center;gap:10px"><strong>${val}%</strong><div class="bar" style="margin-top:0"><i class="${val>=50?'ok':val>=25?'warn':'bad'}" style="width:${val}%"></i></div></div>`;
  }
  else if(typeof val === 'number' && (key==='amount'||key==='allocated'||key==='disbursed')){
    display = `<span class="mono">${val.toLocaleString()} SAR</span>`;
  }
  else if(typeof val === 'number'){
    display = `<span class="mono">${val.toLocaleString()}</span>`;
  }
  else {
    display = String(val);
  }
  return `<div class="field-row"><div class="field-key">${lbl}</div><div class="field-val">${display}</div></div>`;
}

/* ─────────────────────────────────────────────────────────────────────
   @MENTIONS — pool of people who can be tagged in comments.
   Pulls from TEAM (must have email) and STAKEHOLDERS (contact = email).
   ─────────────────────────────────────────────────────────────────── */
function peoplePool(){
  const pool = [];
  TEAM.forEach(m => {
    if(!m.email) return;  // skip people without email
    pool.push({key:'team-'+m.id, id:m.id, name:m.name, email:m.email, source:'team', label:`${m.name} • ${m.role}${m.uni?' • '+m.uni:''}`});
  });
  STAKEHOLDERS.forEach(s => {
    const email = s.contact && /@/.test(s.contact) ? s.contact : '';
    if(!email) return;
    pool.push({key:'stk-'+s.id, id:s.id, name:s.name, email, source:'stakeholder', label:`${s.name} • ${s.role}${s.org?' • '+s.org:''}`});
  });
  return pool;
}

/* Render comment text with @Name mentions styled as pill chips. */
function renderCommentText(text, mentions){
  let html = escapeHtml(text);
  (mentions||[]).forEach(m => {
    const safeName = escapeHtml(m.name);
    // Match the first occurrence of "@Name" (case-insensitive)
    const re = new RegExp('@'+safeName.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&'),'i');
    html = html.replace(re, `<span class="mention-chip" title="${escapeHtml(m.email)}">@${safeName}</span>`);
  });
  return html;
}

/* ═══════════════════════════════════════════════════════════════════
   TURSO (libSQL) live-edit backend
   ───────────────────────────────────────────────────────────────────
   • Reads:  every page load, SELECT * FROM universities ORDER BY id
   • Writes: edits / deletes from the existing UI sync to Turso
   • Reset:  tursoResetSeed() wipes and re-inserts the original 48 rows
             from UNI_SEED (the inline data captured below)

   ⚠️  The auth token below is embedded in the public page, so anyone
       on the internet can use it to write to your Turso DB. That was
       the deliberate choice — "anyone can edit, no login". Use only
       a DB-scoped Turso token, and keep this DB for sandbox/demo use.

   To configure: paste your Turso DB URL and auth token into the two
   constants below (TURSO_URL, TURSO_AUTH_TOKEN), then push to GitHub.
   ═══════════════════════════════════════════════════════════════════ */

const TURSO_URL        = 'libsql://YOUR-DATABASE-NAME.turso.io';   // e.g. libsql://tetco-rdo.turso.io
const TURSO_AUTH_TOKEN = 'YOUR_TURSO_AUTH_TOKEN_HERE';

/* ═══════════════════════════════════════════════════════════════════
   EMAILJS — sends @mention notification emails from the browser.
   Sign up at https://www.emailjs.com (free 200 emails/month), create
   a service + template, then paste the three IDs below. If left as
   placeholders, the page falls back to opening the user's email
   client with a pre-filled message (mailto:).
   ═══════════════════════════════════════════════════════════════════ */
const EMAILJS_PUBLIC_KEY  = 'YOUR_EMAILJS_PUBLIC_KEY';
const EMAILJS_SERVICE_ID  = 'YOUR_EMAILJS_SERVICE_ID';
const EMAILJS_TEMPLATE_ID = 'YOUR_EMAILJS_TEMPLATE_ID';

let _emailjsReady = null;
async function getEmailJS(){
  if (_emailjsReady) return _emailjsReady;
  if (!EMAILJS_PUBLIC_KEY || EMAILJS_PUBLIC_KEY.includes('YOUR_')) {
    throw new Error('EmailJS not configured');
  }
  if (typeof emailjs === 'undefined') {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
      s.onload = res; s.onerror = () => rej(new Error('Failed to load EmailJS SDK'));
      document.head.appendChild(s);
    });
  }
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
  _emailjsReady = emailjs;
  return emailjs;
}

/* Build a human-friendly description of where the comment was posted. */
function _mentionContext(type, id){
  const arr = (window[ (typeof TYPE_ARRAY_MAP !== 'undefined' && TYPE_ARRAY_MAP[type]) || '' ]) || [];
  const r = arr.find(x => x.id === id);
  const title = r ? T(r.title_ar||r.name_ar||r.name||'', r.title_en||r.name_en||r.name||'') : `${type}#${id}`;
  return { entity: type, entityId: id, title: title || (type+'#'+id) };
}

/* Send a notification email to each mentioned person.
   Tries EmailJS first; falls back to opening one mailto: with all
   recipients in BCC if EmailJS isn't configured or fails. */
async function notifyMentions(mentions, text, type, id, author){
  if(!mentions || !mentions.length) return;
  // 1) In-app: push notifications immediately so the bell + Inbox update.
  pushMentionNotifications(mentions, text, type, id, author);
  // 2) Email: continue with EmailJS (or mailto fallback).
  const ctx = _mentionContext(type, id);
  const pageUrl = location.href;
  const subject = `[RDO] ${author} mentioned you in a comment on ${ctx.title}`;
  const body = `${author} mentioned you in a comment:\n\n"${text}"\n\nContext: ${ctx.entity} — ${ctx.title}\nLink: ${pageUrl}\n\n— Sent from RDO Research Management Platform`;

  let usedEmailJS = false;
  try {
    const ejs = await getEmailJS();
    await Promise.all(mentions.map(m =>
      ejs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_name:  m.name,
        to_email: m.email,
        from_name: author,
        comment_text: text,
        context_title: ctx.title,
        context_type:  ctx.entity,
        page_url: pageUrl,
        subject: subject
      })
    ));
    usedEmailJS = true;
    console.log('[RDO] EmailJS sent', mentions.length, 'notifications');
  } catch (err) {
    console.warn('[RDO] EmailJS unavailable —', err.message, '— falling back to mailto');
    const to = mentions.map(m => m.email).join(',');
    const url = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    // Open the user's email client. Safari/iOS may block automatic open without
    // a user gesture — the comment send IS a gesture, so this should work.
    window.open(url, '_blank');
  }
  return usedEmailJS;
}

window.notifyMentions = notifyMentions;

/* ─────────────────────────────────────────────────────────────────────
   IN-APP NOTIFICATIONS — bell badge + dropdown panel + Inbox row.
   Triggered alongside email (in notifyMentions) so people see the @mention
   when they next open the system, even if email is filtered/missed.
   ─────────────────────────────────────────────────────────────────── */

function pushMentionNotifications(mentions, text, type, id, author){
  const ctx = _mentionContext(type, id);
  const now = new Date().toISOString();
  mentions.forEach(m => {
    NOTIFICATIONS.unshift({
      id: Date.now() + Math.random(),
      recipient_key: m.key,
      recipient_id: m.id,
      recipient_email: m.email,
      recipient_name: m.name,
      recipient_source: m.source,
      type: 'mention',
      by: author,
      comment_text: text,
      context_type: type,
      context_id: id,
      context_title: ctx.title,
      date: now,
      read: false
    });
  });
  refreshBell();
}

function unreadCountForCurrentUser(){
  return NOTIFICATIONS.filter(n => n.recipient_key === CURRENT_USER_KEY && !n.read).length;
}

function refreshBell(){
  const c = unreadCountForCurrentUser();
  const el = document.getElementById('bellCount');
  if(!el) return;
  if(c > 0){ el.textContent = c > 99 ? '99+' : String(c); el.style.display = 'inline-block'; }
  else { el.style.display = 'none'; }
  // If the panel is open, re-render it so it reflects the latest list
  const p = document.getElementById('notifPanel');
  if(p && p.style.display !== 'none') renderNotifPanel();
}

function toggleNotifPanel(e){
  if(e) e.stopPropagation();
  const p = document.getElementById('notifPanel');
  if(!p) return;
  if(p.style.display === 'none' || !p.style.display){
    renderNotifPanel();
    p.style.display = 'block';
  } else {
    p.style.display = 'none';
  }
}

function renderNotifPanel(){
  const p = document.getElementById('notifPanel');
  if(!p) return;
  const mine = NOTIFICATIONS.filter(n => n.recipient_key === CURRENT_USER_KEY).slice(0, 30);
  const unread = mine.filter(n => !n.read).length;
  const head = `<div class="notif-head">
    <h4>${T('الإشعارات','Notifications')} ${unread?`<span style="background:#ef4444;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-inline-start:6px">${unread}</span>`:''}</h4>
    ${unread ? `<button class="mark-all" onclick="markAllNotifRead()">${T('تحديد الكل كمقروء','Mark all read')}</button>` : ''}
  </div>`;
  if(!mine.length){
    p.innerHTML = head + `<div class="notif-empty">${T('لا توجد إشعارات لك بعد','No notifications for you yet')}</div>`;
    return;
  }
  const body = mine.map(n => {
    const when = _ago(n.date);
    const snippet = (n.comment_text||'').slice(0,140);
    return `<div class="notif-row${n.read?'':' unread'}" onclick="openNotification(${n.id.toString().includes('.')?`'${n.id}'`:n.id})">
      <div class="notif-icon">@</div>
      <div class="notif-body">
        <div class="notif-name"><strong>${escapeHtml(n.by)}</strong> ${T('أشار إليك في','mentioned you on')} <span style="color:#6557F5">${escapeHtml(n.context_title)}</span></div>
        <div class="notif-snip">${escapeHtml(snippet)}${n.comment_text.length>140?'…':''}</div>
        <div class="notif-when">${when}</div>
      </div>
      ${n.read ? '' : '<div class="notif-dot"></div>'}
    </div>`;
  }).join('');
  p.innerHTML = head + body;
}

function _ago(iso){
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime())/1000;
  if(diff < 60) return T('الآن','just now');
  if(diff < 3600) return Math.floor(diff/60)+' '+T('دقيقة','min');
  if(diff < 86400) return Math.floor(diff/3600)+' '+T('ساعة','h');
  if(diff < 7*86400) return Math.floor(diff/86400)+' '+T('يوم','d');
  return d.toISOString().slice(0,10);
}

function openNotification(notifId){
  const n = NOTIFICATIONS.find(x => String(x.id) === String(notifId));
  if(!n) return;
  n.read = true;
  document.getElementById('notifPanel').style.display = 'none';
  refreshBell();
  // Navigate to the source record
  if(typeof openRecord === 'function') openRecord(n.context_type, n.context_id);
}

function markAllNotifRead(){
  NOTIFICATIONS.filter(n => n.recipient_key === CURRENT_USER_KEY).forEach(n => n.read = true);
  refreshBell();
}

/* Close the notification panel when clicking outside it */
document.addEventListener('click', (e) => {

// Capture the inline data as the immutable seed used by Reset.
const UNI_SEED = JSON.parse(JSON.stringify(UNI_DATA));

let _tursoClient = null;
async function getTurso(){
  if (_tursoClient) return _tursoClient;
  if (!TURSO_URL || TURSO_URL.includes('YOUR-DATABASE-NAME')) {
    throw new Error('Turso not configured (TURSO_URL placeholder still in place)');
  }
  const mod = await import('https://esm.sh/@libsql/client@0.14.0/web');
  _tursoClient = mod.createClient({ url: TURSO_URL, authToken: TURSO_AUTH_TOKEN });
  return _tursoClient;
}

function _rowToUni(r){
  return {
    id: r.id,
    name_ar: r.name_ar,
    name_en: r.name_en,
    postdoc: { r: r.postdoc_r|0, allocated: r.postdoc_allocated|0, disbursed: r.postdoc_disbursed|0, launched: r.postdoc_launched|0, status: r.postdoc_status || '' },
    infra:   { allocated: r.infra_allocated|0,   disbursed: r.infra_disbursed|0,   status: r.infra_status || '' },
    hqr:     { allocated: r.hqr_allocated|0,     disbursed: r.hqr_disbursed|0,     status: r.hqr_status || '' }
  };
}

async function loadUniversitiesFromTurso(){
  const client = await getTurso();
  const rs = await client.execute('SELECT * FROM universities ORDER BY id');
  if (!rs.rows || !rs.rows.length) throw new Error('universities table is empty');
  UNI_DATA = rs.rows.map(_rowToUni);
  window.UNI_DATA = UNI_DATA;
  console.log('[RDO] Loaded', UNI_DATA.length, 'universities from Turso');
}

async function tursoUpdateUniversity(u){
  try {
    const client = await getTurso();
    await client.execute({
      sql: `UPDATE universities SET
              name_ar=?, name_en=?,
              postdoc_r=?, postdoc_allocated=?, postdoc_disbursed=?, postdoc_launched=?, postdoc_status=?,
              infra_allocated=?, infra_disbursed=?, infra_status=?,
              hqr_allocated=?, hqr_disbursed=?, hqr_status=?,
              updated_at=datetime('now')
            WHERE id=?`,
      args: [
        u.name_ar||'', u.name_en||'',
        (u.postdoc&&u.postdoc.r)|0, (u.postdoc&&u.postdoc.allocated)|0, (u.postdoc&&u.postdoc.disbursed)|0,
        (u.postdoc&&u.postdoc.launched)|0, (u.postdoc&&u.postdoc.status)||'',
        (u.infra&&u.infra.allocated)|0, (u.infra&&u.infra.disbursed)|0, (u.infra&&u.infra.status)||'',
        (u.hqr&&u.hqr.allocated)|0, (u.hqr&&u.hqr.disbursed)|0, (u.hqr&&u.hqr.status)||'',
        u.id
      ]
    });
    console.log('[RDO] Turso UPDATE id=' + u.id + ' OK');
  } catch (err) {
    console.error('[RDO] Turso UPDATE failed:', err);
    if (typeof toast === 'function') toast('Turso save failed: ' + err.message, true);
  }
}

async function tursoDeleteUniversity(id){
  try {
    const client = await getTurso();
    await client.execute({ sql: 'DELETE FROM universities WHERE id=?', args: [id] });
    console.log('[RDO] Turso DELETE id=' + id + ' OK');
  } catch (err) {
    console.error('[RDO] Turso DELETE failed:', err);
    if (typeof toast === 'function') toast('Turso delete failed: ' + err.message, true);
  }
}

async function tursoResetSeed(){
  if (!confirm(T(
    'إعادة تعيين بيانات الجامعات إلى الحالة الأصلية (٤٨ سجلاً)؟ سيتم محو كل التعديلات الحالية.',
    'Reset universities to the original 48 seed rows? This will wipe all current edits.'
  ))) return;
  try {
    const client = await getTurso();
    // Build a single batch transaction
    const stmts = [{ sql: 'DELETE FROM universities', args: [] }];
    for (const u of UNI_SEED) {
      stmts.push({
        sql: `INSERT INTO universities
              (id,name_ar,name_en,postdoc_r,postdoc_allocated,postdoc_disbursed,postdoc_launched,postdoc_status,
               infra_allocated,infra_disbursed,infra_status,hqr_allocated,hqr_disbursed,hqr_status)
              VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        args: [
          u.id, u.name_ar, u.name_en,
          (u.postdoc&&u.postdoc.r)|0, (u.postdoc&&u.postdoc.allocated)|0, (u.postdoc&&u.postdoc.disbursed)|0,
          (u.postdoc&&u.postdoc.launched)|0, (u.postdoc&&u.postdoc.status)||'',
          (u.infra&&u.infra.allocated)|0, (u.infra&&u.infra.disbursed)|0, (u.infra&&u.infra.status)||'',
          (u.hqr&&u.hqr.allocated)|0, (u.hqr&&u.hqr.disbursed)|0, (u.hqr&&u.hqr.status)||''
        ]
      });
    }
    await client.batch(stmts, 'write');
    await loadUniversitiesFromTurso();
    if (typeof toast === 'function') toast(T('تمت إعادة التعيين ✓','Reset complete ✓'));
    if (typeof renderHome === 'function') renderHome();
  } catch (err) {
    console.error('[RDO] Turso reset failed:', err);
    if (typeof toast === 'function') toast('Turso reset failed: ' + err.message, true);
  }
}

// Console helper: window.rdoQuery('SELECT name_en, postdoc_r FROM universities WHERE postdoc_r > 0')
window.rdoQuery = async (sql, args=[]) => {
  const client = await getTurso();
  const rs = await client.execute({ sql, args });
  return rs.rows;
};
window.tursoResetSeed = tursoResetSeed;
